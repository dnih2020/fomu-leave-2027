<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOMU 2027 Annual Leave</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // --- LIVE FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDGn5URPiTnGoEZPlijZsc6j8PPHhonOYc",
            authDomain: "fomu-leave-2027.firebaseapp.com",
            projectId: "fomu-leave-2027",
            storageBucket: "fomu-leave-2027.firebasestorage.app",
            messagingSenderId: "327078540006",
            appId: "1:327078540006:web:484896982f0060960d8127"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Official 21 Staff Members Allowed List (Emails or Names)
        const ALLOWED_STAFF = [
            "admin", "afaa", "nafha", "uzain", "meesham", "asima"
            // Add other authorized staff emails or names here
        ];

        function App() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [leaveData, setLeaveData] = React.useState({ spins: {}, leaves: {} });
            const [spinning, setSpinning] = React.useState(false);
            const [displayNumber, setDisplayNumber] = React.useState("?");

            React.useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                });
                return unsubscribe;
            }, []);

            React.useEffect(() => {
                if (user) {
                    const unsubscribe = db.collection("fomu").doc("leaveData_2027")
                        .onSnapshot((doc) => {
                            if (doc.exists) {
                                setLeaveData(doc.data());
                            } else {
                                db.collection("fomu").doc("leaveData_2027").set({ spins: {}, leaves: {} });
                            }
                        });
                    return unsubscribe;
                }
            }, [user]);

            const signInWithGoogle = () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch(error => alert("Login Error: " + error.message));
            };

            const logOut = () => auth.signOut();

            const handleSpin = () => {
                if (!user) return;
                setSpinning(true);
                
                let counter = 0;
                const interval = setInterval(() => {
                    setDisplayNumber(Math.floor(Math.random() * 21) + 1);
                    counter++;
                    if (counter > 15) {
                        clearInterval(interval);
                        // Pick final unique number
                        const currentSpins = leaveData.spins || {};
                        const takenNumbers = Object.values(currentSpins);
                        let finalNum;
                        do {
                            finalNum = Math.floor(Math.random() * 21) + 1;
                        } while (takenNumbers.includes(finalNum) && takenNumbers.length < 21);

                        db.collection("fomu").doc("leaveData_2027").set({
                            spins: { ...currentSpins, [user.uid]: finalNum }
                        }, { merge: true });
                        setSpinning(false);
                    }
                }, 100);
            };

            if (loading) {
                return <div className="flex items-center justify-center min-h-screen bg-slate-900 text-slate-400">Loading FOMU Portal...</div>;
            }

            if (!user) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-slate-900 p-4">
                        <div className="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-8 text-center">
                            <h1 className="text-2xl font-bold text-emerald-400 mb-2">FOMU Annual Leave 2027</h1>
                            <p className="text-slate-400 mb-8 text-sm">Secure staff portal for lucky draw turn assignment and 30-day leave scheduling.</p>
                            <button 
                                onClick={signInWithGoogle}
                                className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200"
                            >
                                Sign in with Google
                            </button>
                        </div>
                    </div>
                );
            }

            const myNumber = leaveData.spins?.[user.uid];

            return (
                <div className="max-w-xl mx-auto bg-slate-900 min-h-screen text-slate-100 pb-12">
                    {/* Header */}
                    <div className="flex items-center justify-between border-b border-slate-800 px-6 py-4 bg-slate-900/80 sticky top-0 backdrop-blur z-10">
                        <h1 className="font-bold text-emerald-400 tracking-wide">FOMU <span className="font-light text-slate-400">| Leave 2027</span></h1>
                        <button onClick={logOut} className="text-xs text-slate-400 hover:text-rose-400 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                            Sign Out
                        </button>
                    </div>

                    {/* User Card */}
                    <div className="p-6 m-4 bg-slate-800/60 border border-slate-700/80 rounded-2xl flex items-center gap-4 shadow-md">
                        <div className="h-14 w-14 rounded-2xl bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 flex items-center justify-center text-xl font-bold">
                            {user.displayName ? user.displayName.charAt(0).toUpperCase() : "U"}
                        </div>
                        <div>
                            <h2 className="text-lg font-bold text-slate-100">{user.displayName}</h2>
                            <p className="text-xs text-emerald-400 font-medium">
                                {myNumber ? `Assigned Lucky Number #${myNumber}` : "Pending Lucky Draw Spin"}
                            </p>
                        </div>
                    </div>

                    {/* Main Interactive Section */}
                    <div className="px-4">
                        {!myNumber ? (
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 text-center shadow-lg">
                                <h3 className="font-bold text-slate-200 mb-2">Lucky Draw Turn Assignment</h3>
                                <p className="text-xs text-slate-400 mb-6">Spin the wheel to lock in your priority sequence number for 2027 leave allocation.</p>
                                
                                <div className="text-5xl font-black text-emerald-400 my-6 bg-slate-900/60 py-6 rounded-xl border border-slate-700">
                                    {spinning ? displayNumber : "🎲"}
                                </div>

                                <button 
                                    onClick={handleSpin}
                                    disabled={spinning}
                                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition duration-200"
                                >
                                    {spinning ? "Spinning..." : "Spin for my Number"}
                                </button>
                            </div>
                        ) : (
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 text-center shadow-lg">
                                <h3 className="font-bold text-slate-200 mb-2">Your Turn is Locked!</h3>
                                <p className="text-sm text-emerald-400 font-semibold mb-2">Lucky Number #{myNumber}</p>
                                <p className="text-xs text-slate-400">You will be able to select your 30-day window when your sequence order is reached.</p>
                            </div>
                        )}
                    </div>

                    {/* Live Turn Order Table */}
                    <div className="p-4 mt-4">
                        <h3 className="font-bold text-slate-400 mb-3 text-xs uppercase tracking-wider px-1">Live Team Turn Order</h3>
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-lg">
                            {Object.keys(leaveData.spins || {}).length === 0 ? (
                                <div className="p-6 text-center text-xs text-slate-500">No staff have spun yet. Be the first!</div>
                            ) : (
                                Object.entries(leaveData.spins).map(([uid, num], idx) => (
                                    <div key={uid} className="flex justify-between items-center p-3.5 border-b border-slate-700/50 last:border-none text-sm">
                                        <span className="font-medium text-slate-300">Staff Member ({uid.substring(0, 6)}...)</span>
                                        <span className="text-xs font-bold text-emerald-400 bg-emerald-950/60 border border-emerald-800/50 px-2.5 py-1 rounded-lg">
                                            #{num}
                                        </span>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
