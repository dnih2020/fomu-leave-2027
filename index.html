function normalizeServerState(data) {
  const fresh = createFreshState();
  if (!data || typeof data !== 'object') return fresh;

  const serverStaff = Array.isArray(data.staff) ? data.staff : [];
  const mergedStaff = INITIAL_STAFF.map(initMember => {
    const found = serverStaff.find(x => Number(x.id) === initMember.id) ||
                  serverStaff.find(x => String(x.email || '').toLowerCase() === initMember.email.toLowerCase());
    if (!found) {
      return {
        id: initMember.id,
        name: initMember.name,
        email: initMember.email.toLowerCase(),
        canSpin: initMember.canSpin,
        luckyNumber: null,
        spunAt: null,
        period1: null,
        period2: null,
        confirmedAt: null,
        needsHolidayReview: false
      };
    }
    return {
      id: initMember.id,
      name: found.name || initMember.name,
      email: String(found.email || initMember.email).toLowerCase(),
      canSpin: found.canSpin !== false,
      luckyNumber: (found.luckyNumber !== undefined && found.luckyNumber !== null) ? Number(found.luckyNumber) : null,
      spunAt: found.spunAt || null,
      period1: found.period1 || null,
      period2: found.period2 || null,
      confirmedAt: found.confirmedAt || null,
      needsHolidayReview: Boolean(found.needsHolidayReview)
    };
  });

  const mergedJan2028 = {
    ...INITIAL_JAN2028_POLICY,
    ...(data.jan2028Policy || {})
  };
  if (!mergedJan2028.maxEndDate || mergedJan2028.maxEndDate > MAX_ALLOWED_DATE || mergedJan2028.maxEndDate < '2028-01-01') {
    mergedJan2028.maxEndDate = MAX_ALLOWED_DATE;
  }

  return {
    ...fresh,
    ...data,
    staff: mergedStaff,
    monthLimits: { ...INITIAL_MONTH_LIMITS, ...(data.monthLimits || {}) },
    jan2028Policy: mergedJan2028,
    dateLimits: data.dateLimits || {},
    holidays: Array.isArray(data.holidays) ? data.holidays : INITIAL_HOLIDAYS.map(h => ({ ...h })),
    archives: Array.isArray(data.archives) ? data.archives : [],
    activity: Array.isArray(data.activity) ? data.activity : []
  };
}

// 2. AUTHENTICATED REAL-TIME FIRESTORE SYNC & ATOMIC TRANSACTIONS
// ============================================================================
function startFirestoreSync() {
  if (unsubscribeSnapshot) {
    unsubscribeSnapshot();
    unsubscribeSnapshot = null;
  }

  unsubscribeSnapshot = plannerDocRef.onSnapshot(
    (doc) => {
      cloudError = '';
      if (doc.exists) {
        state = normalizeServerState(doc.data());
        cloudSynced = true;
        renderApp();
        refreshOpenGanttModal();
      } else {
        db.runTransaction(async (tx) => {
          const snap = await tx.get(plannerDocRef);
          if (!snap.exists) {
            const initial = createFreshState();
            tx.set(plannerDocRef, initial);
            return initial;
          }
          return normalizeServerState(snap.data());
        }).then((resolvedState) => {
          if (resolvedState) state = resolvedState;
          cloudSynced = true;
          renderApp();
          refreshOpenGanttModal();
        }).catch((err) => {
          console.error('Initial doc check error:', err);
        });
      }
    },
    (err) => {
      console.error('Firestore listener error:', err);
      cloudError = err.message || 'Unable to sync with cloud database.';
      renderApp();
    }
  );
}

auth.onAuthStateChanged((user) => {
  currentUser = user;
  authInitialized = true;
  if (user) {
    startFirestoreSync();
  } else {
    if (unsubscribeSnapshot) {
      unsubscribeSnapshot();
      unsubscribeSnapshot = null;
    }
    cloudSynced = false;
  }
  renderApp();
});

async function runAtomicPlannerUpdate(mutatorFn, successToastMsg = '') {
  if (!currentUser) {
    showToast('Please sign in with Google first.', 'err');
    throw new Error('Not signed in');
  }
  if (!cloudSynced) {
    showToast('Still syncing live data from cloud. Please wait a moment.', 'warn');
    throw new Error('Cloud not synced yet');
  }

  try {
    let resultVal;
    const committedState = await db.runTransaction(async (transaction) => {
      const sfDoc = await transaction.get(plannerDocRef);
      const latestDraft = sfDoc.exists
        ? normalizeServerState(sfDoc.data())
        : createFreshState();

      resultVal = mutatorFn(latestDraft);

      latestDraft.revision = (latestDraft.revision || 1) + 1;
      if (Array.isArray(latestDraft.activity) && latestDraft.activity.length > 120) {
        latestDraft.activity = latestDraft.activity.slice(0, 120);
      }

      transaction.set(plannerDocRef, JSON.parse(JSON.stringify(latestDraft)));
      return latestDraft;
    });

    state = committedState;
    cloudSynced = true;
    renderApp();
    refreshOpenGanttModal();
    if (successToastMsg) showToast(successToastMsg);
    return resultVal;
  } catch (err) {
    showToast(err.message || 'Could not save to cloud. Please try again.', 'err');
    throw err;
  }
}

function pad2(n) { return String(n).padStart(2, '0'); }
function esc(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}
function normalizeEmail(email) {
  const clean = String(email || '').trim().toLowerCase();
  const parts = clean.split('@');
  if (parts.length !== 2) return clean;
  if (parts[1] === 'gmail.com' || parts[1] === 'googlemail.com') {
    return parts[0].split('+')[0].replace(/\./g, '') + '@gmail.com';
  }
  return clean;
}
function isManager(email) {
  const norm = normalizeEmail(email);
  return MANAGER_EMAILS.some(m => normalizeEmail(m) === norm);
}
function parseIsoUTC(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function formatIsoUTC(dt) {
  return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`;
}
function addDays(iso, delta) {
  const dt = parseIsoUTC(iso);
  dt.setUTCDate(dt.getUTCDate() + delta);
  return formatIsoUTC(dt);
}
function eachDateInRange(startIso, endIso, callback) {
  if (!startIso || !endIso || startIso > endIso) return;
  let cur = startIso;
  let safety = 0;
  while (cur <= endIso && safety < 420) {
    callback(cur);
    cur = addDays(cur, 1);
    safety++;
  }
}

function getJan2028PolicyForState(st) {
  const pol = { ...INITIAL_JAN2028_POLICY, ...((st && st.jan2028Policy) || {}) };
  if (!pol.maxEndDate || pol.maxEndDate > MAX_ALLOWED_DATE || pol.maxEndDate < '2028-01-01') {
    pol.maxEndDate = MAX_ALLOWED_DATE;
  }
  return pol;
}

function isAllowedPlannerDate(iso, st = state) {
  if (!iso || iso < '2027-01-01') return false;
  const pol = getJan2028PolicyForState(st);
  const ceiling = pol.maxEndDate < MAX_ALLOWED_DATE ? pol.maxEndDate : MAX_ALLOWED_DATE;
  return iso <= ceiling;
}

function calculateWorkingDays(startIso, endIso, holidaysList) {
  if (!startIso || !endIso || startIso > endIso) {
    return { valid: false, calendarDays: 0, weekendDays: 0, weekdayHolidays: 0, workingDays: 0, jan2028Days: 0, dates: [] };
  }
  if (startIso < '2027-01-01' || endIso > MAX_ALLOWED_DATE) {
    return { valid: false, error: 'Dates must be between 01 Jan 2027 and 31 Jan 2028.', calendarDays: 0, weekendDays: 0, weekdayHolidays: 0, workingDays: 0, jan2028Days: 0, dates: [] };
  }
  const holSet = new Set((holidaysList || state.holidays).map(h => h.date));
  let calendarDays = 0, weekendDays = 0, weekdayHolidays = 0, jan2028Days = 0;
  const dates = [];
  eachDateInRange(startIso, endIso, d => {
    dates.push(d);
    calendarDays++;
    if (d.startsWith('2028-01-')) jan2028Days++;
    const dow = parseIsoUTC(d).getUTCDay();
    if (dow === 5 || dow === 6) weekendDays++;
    else if (holSet.has(d)) weekdayHolidays++;
  });
  return {
    valid: true,
    calendarDays,
    weekendDays,
    weekdayHolidays,
    workingDays: calendarDays - weekendDays - weekdayHolidays,
    jan2028Days,
    dates
  };
}

function findEndDateForWorkingDays(startIso, targetWorkingDays, st = state) {
  if (!startIso || targetWorkingDays <= 0) return null;
  const pol = getJan2028PolicyForState(st);
  const maxEnd = pol.maxEndDate < MAX_ALLOWED_DATE ? pol.maxEndDate : MAX_ALLOWED_DATE;
  let cur = startIso;
  while (cur <= maxEnd) {
    const res = calculateWorkingDays(startIso, cur, st.holidays);
    if (res.workingDays === targetWorkingDays) return cur;
    cur = addDays(cur, 1);
  }
  return null;
}

function getDailyLimitForState(st, iso) {
  if (st.dateLimits && st.dateLimits[iso] !== undefined) {
    return Number(st.dateLimits[iso]);
  }
  if (iso.startsWith('2028-01-')) {
    const pol = getJan2028PolicyForState(st);
    return Number(pol.staffLimit || 2);
  }
  const month = Number(iso.slice(5, 7));
  return Number((st.monthLimits && st.monthLimits[month]) || 2);
}

function getDailyLimit(iso) {
  return getDailyLimitForState(state, iso);
}

function getStaffOnLeaveOnDate(iso, excludeStaffId = null, customState = null) {
  const st = customState || state;
  const names = [];
  st.staff.forEach(s => {
    if (!s.confirmedAt || s.id === excludeStaffId) return;
    const inP1 = s.period1 && iso >= s.period1.start && iso <= s.period1.end;
    const inP2 = s.period2 && iso >= s.period2.start && iso <= s.period2.end;
    if (inP1 || inP2) names.push(s.name);
  });
  return names;
}

function getActiveParticipants(customState = null) {
  const st = customState || state;
  return st.staff.filter(s => s.canSpin !== false);
}

function getCurrentTurnMember(customState = null) {
  const st = customState || state;
  const active = getActiveParticipants(st);
  if (active.length === 0 || !active.every(s => s.luckyNumber !== null)) return null;
  const sorted = active.slice().sort((a, b) => a.luckyNumber - b.luckyNumber);
  return sorted.find(s => !s.confirmedAt) || null;
}

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function showToast(msg, type = 'info') {
  const box = document.getElementById('toastBox');
  if (!box) return;
  box.className = 'toast-msg ' + (
    type === 'err' ? 'bg-rose-600 text-white' :
    type === 'warn' ? 'bg-amber-100 text-amber-900 border border-amber-300' :
    'bg-indigo-950 text-white border border-indigo-700'
  );
  box.textContent = msg;
  box.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => box.classList.add('hidden'), 3500);
}

function getCurrentUserRecord() {
  if (!currentUser || !currentUser.email) return null;
  const norm = normalizeEmail(currentUser.email);
  let found = state.staff.find(s => normalizeEmail(s.email) === norm);
  if (!found && isManager(currentUser.email)) {
    found = state.staff.find(s => s.id === 21);
  }
  return found || null;
}

function handleSpinClick() {
  if (isSpinning) return;
  if (!cloudSynced) return showToast('Syncing live data from cloud, please wait...', 'warn');
  const me = getCurrentUserRecord();
  if (!me) return showToast('Staff profile not found for this email.', 'err');
  if (state.finalized) return showToast('Calendar is finalised and locked.', 'err');
  if (!state.drawOpen) return showToast('The lucky draw is not open yet.', 'warn');
  if (me.canSpin === false) return showToast('Your account is excluded from the spin.', 'err');
  if (me.luckyNumber !== null) return showToast(`You already spun #${pad2(me.luckyNumber)}.`, 'warn');

  const active = getActiveParticipants();
  const used = new Set(active.map(s => s.luckyNumber).filter(n => n !== null));
  const pool = [];
  for (let i = 1; i <= active.length; i++) {
    if (!used.has(i)) pool.push(i);
  }
  if (pool.length === 0) return showToast('All lucky numbers have been assigned.', 'err');

  isSpinning = true;
  wheelAngle += 1080 + Math.floor(Math.random() * 360);
  const wheelEl = document.getElementById('spinWheelRing');
  const hubEl = document.getElementById('spinWheelHub');
  if (wheelEl) wheelEl.style.transform = `rotate(${wheelAngle}deg)`;

  let ticks = 0;
  const rollInterval = setInterval(async () => {
    ticks++;
    if (hubEl && pool.length > 0) {
      hubEl.textContent = pad2(pool[Math.floor(Math.random() * pool.length)]);
    }
    if (ticks >= 13) {
      clearInterval(rollInterval);
      try {
        const assignedNum = await runAtomicPlannerUpdate((draft) => {
          const target = draft.staff.find(s => s.id === me.id);
          if (!target) throw new Error('Staff profile not found.');
          if (target.luckyNumber !== null) return target.luckyNumber;

          const activeList = draft.staff.filter(s => s.canSpin !== false);
          const taken = new Set(activeList.map(s => s.luckyNumber).filter(n => n !== null));
          const avail = [];
          for (let i = 1; i <= activeList.length; i++) {
            if (!taken.has(i)) avail.push(i);
          }
          if (avail.length === 0) throw new Error('All lucky numbers have been assigned.');

          const chosen = avail[Math.floor(Math.random() * avail.length)];
          target.luckyNumber = chosen;
          target.spunAt = new Date().toISOString();
          draft.activity.unshift({
            at: new Date().toISOString(),
            actor: currentUser.email,
            text: `${target.name} spun lucky number #${pad2(chosen)}`
          });
          return chosen;
        });
        isSpinning = false;
        showToast(`You got Lucky Number #${pad2(assignedNum)}!`);
        renderApp();
      } catch (e) {
        isSpinning = false;
        renderApp();
      }
    }
  }, 80);
}

function applyPeriodDays(periodNum, rawDays) {
  const days = Number(rawDays);
  if (!days || days < 1 || days > MAX_ENTITLEMENT_DAYS) {
    return showToast(`Enter working days between 1 and ${MAX_ENTITLEMENT_DAYS}.`, 'warn');
  }
  if (periodNum === 1) {
    if (!leaveForm.p1Start) {
      return showToast('Pick a First day for Period 1 first (or tap a date on the mini-calendar).', 'warn');
    }
    const endIso = findEndDateForWorkingDays(leaveForm.p1Start, days, state);
    if (!endIso) {
      return showToast(`Could not fit ${days} working days from ${leaveForm.p1Start} within the allowed limit.`, 'warn');
    }
    leaveForm.p1End = endIso;
    leaveForm.p1CustomDays = String(days);
    pickerMonthKey = endIso.slice(0, 7);
  } else {
    leaveForm.p2Enabled = true;
    if (!leaveForm.p2Start) {
      return showToast('Pick a First day for Period 2 first (or tap a date on the mini-calendar).', 'warn');
    }
    const endIso = findEndDateForWorkingDays(leaveForm.p2Start, days, state);
    if (!endIso) {
      return showToast(`Could not fit ${days} working days from ${leaveForm.p2Start} within the allowed limit.`, 'warn');
    }
    leaveForm.p2End = endIso;
    leaveForm.p2CustomDays = String(days);
    pickerMonthKey = endIso.slice(0, 7);
  }
  renderApp();
}

function handleMiniCalendarDateClick(iso) {
  if (!isAllowedPlannerDate(iso, state)) {
    return showToast('Dates in Feb 2028 or later are not allowed.', 'err');
  }
  selectedCalDate = iso;
  if (activePickTarget === 'p1Start') {
    leaveForm.p1Start = iso;
    if (leaveForm.p1End && leaveForm.p1End < iso) leaveForm.p1End = '';
    activePickTarget = 'p1End';
  } else if (activePickTarget === 'p1End') {
    if (leaveForm.p1Start && iso < leaveForm.p1Start) {
      leaveForm.p1Start = iso;
      leaveForm.p1End = '';
      activePickTarget = 'p1End';
    } else {
      leaveForm.p1End = iso;
    }
  } else if (activePickTarget === 'p2Start') {
    leaveForm.p2Enabled = true;
    leaveForm.p2Start = iso;
    if (leaveForm.p2End && leaveForm.p2End < iso) leaveForm.p2End = '';
    activePickTarget = 'p2End';
  } else if (activePickTarget === 'p2End') {
    leaveForm.p2Enabled = true;
    if (leaveForm.p2Start && iso < leaveForm.p2Start) {
      leaveForm.p2Start = iso;
      leaveForm.p2End = '';
      activePickTarget = 'p2End';
    } else {
      leaveForm.p2End = iso;
    }
  }
  renderApp();
}

function validatePeriodBlock(startIso, endIso, label, staffId, st = state) {
  const pol = getJan2028PolicyForState(st);
  if (!startIso && !endIso) {
    return { active: false, valid: true, workingDays: 0, calendarDays: 0, dates: [], error: '' };
  }
  if (!startIso || !endIso) {
    return { active: true, valid: false, workingDays: 0, calendarDays: 0, dates: [], error: `${label}: Pick both First day and Last day.` };
  }
  if (startIso < '2027-01-01' || endIso > MAX_ALLOWED_DATE) {
    return { active: true, valid: false, workingDays: 0, calendarDays: 0, dates: [], error: `${label}: Dates must be between 01 Jan 2027 and 31 Jan 2028.` };
  }
  if (endIso > pol.maxEndDate) {
    return { active: true, valid: false, workingDays: 0, calendarDays: 0, dates: [], error: `${label}: Latest allowed date set by manager is ${pol.maxEndDate}.` };
  }
  if (startIso > endIso) {
    return { active: true, valid: false, workingDays: 0, calendarDays: 0, dates: [], error: `${label}: First day cannot be after Last day.` };
  }

  const calc = calculateWorkingDays(startIso, endIso, st.holidays);
  if (calc.workingDays <= 0) {
    return { active: true, valid: false, workingDays: 0, calendarDays: calc.calendarDays, dates: calc.dates, error: `${label}: Must contain at least 1 working day.` };
  }

  if (calc.jan2028Days > 0) {
    if (calc.jan2028Days > Number(pol.maxDaysInJan || 31)) {
      return {
        active: true, valid: false, workingDays: calc.workingDays, calendarDays: calc.calendarDays, dates: calc.dates,
        error: `${label}: Max ${pol.maxDaysInJan} day(s) allowed in Jan 2028 (selected ${calc.jan2028Days}).`
      };
    }
    if (pol.carryoverOnly && !startIso.startsWith('2027-12-')) {
      return {
        active: true, valid: false, workingDays: calc.workingDays, calendarDays: calc.calendarDays, dates: calc.dates,
        error: `${label}: Jan 2028 leave is only allowed as carryover starting in December 2027.`
      };
    }
  }

  const fullDates = [];
  for (const d of calc.dates) {
    const booked = getStaffOnLeaveOnDate(d, staffId, st);
    const lim = getDailyLimitForState(st, d);
    if (booked.length >= lim) {
      fullDates.push(`${d} (${booked.join(', ')})`);
    }
  }

  if (fullDates.length > 0) {
    return {
      active: true,
      valid: false,
      workingDays: calc.workingDays,
      calendarDays: calc.calendarDays,
      dates: calc.dates,
      fullDates,
      error: `${label}: Full on ${fullDates.slice(0, 3).join('; ')}${fullDates.length > 3 ? ` (+${fullDates.length - 3} more)` : ''}.`
    };
  }

  return {
    active: true,
    valid: true,
    workingDays: calc.workingDays,
    calendarDays: calc.calendarDays,
    jan2028Days: calc.jan2028Days,
    dates: calc.dates,
    fullDates: [],
    error: ''
  };
}

function validateCurrentLeaveForm(staffId, st = state) {
  const p1 = validatePeriodBlock(leaveForm.p1Start, leaveForm.p1End, 'Period 1', staffId, st);
  const p2 = leaveForm.p2Enabled
    ? validatePeriodBlock(leaveForm.p2Start, leaveForm.p2End, 'Period 2', staffId, st)
    : { active: false, valid: true, workingDays: 0, calendarDays: 0, dates: [], error: '' };

  const totalWorking = (p1.valid ? p1.workingDays : 0) + (p2.valid ? p2.workingDays : 0);
  const errors = [];

  if (!p1.active || !leaveForm.p1Start || !leaveForm.p1End) {
    errors.push('Select First day and Last day for First leave period.');
  } else if (p1.error) {
    errors.push(p1.error);
  }

  if (p2.active && p2.error) {
    errors.push(p2.error);
  }

  if (leaveForm.p1Start && leaveForm.p1End && leaveForm.p2Enabled && leaveForm.p2Start && leaveForm.p2End) {
    const overlap = !(leaveForm.p1End < leaveForm.p2Start || leaveForm.p2End < leaveForm.p1Start);
    if (overlap) {
      errors.push('First and second leave periods cannot overlap.');
    }
  }

  if (totalWorking < 1) {
    errors.push('Select at least 1 working day.');
  } else if (totalWorking > MAX_ENTITLEMENT_DAYS) {
    errors.push(`Total working days cannot exceed ${MAX_ENTITLEMENT_DAYS} (currently ${totalWorking}).`);
  }

  return {
    p1,
    p2,
    totalWorking,
    errors,
    errorMsg: errors[0] || '',
    canConfirm: errors.length === 0 && totalWorking >= 1 && totalWorking <= MAX_ENTITLEMENT_DAYS
  };
}

async function confirmLeaveSelection() {
  if (!cloudSynced) return showToast('Syncing live data from cloud, please wait...', 'warn');
  const me = getCurrentUserRecord();
  if (!me) return;
  const check = validateCurrentLeaveForm(me.id);
  if (!check.canConfirm) return showToast(check.errorMsg || 'Check your selected dates.', 'err');

  const p1Payload = (leaveForm.p1Start && leaveForm.p1End)
    ? { start: leaveForm.p1Start, end: leaveForm.p1End }
    : null;
  const p2Payload = (leaveForm.p2Enabled && leaveForm.p2Start && leaveForm.p2End)
    ? { start: leaveForm.p2Start, end: leaveForm.p2End }
    : null;

  await runAtomicPlannerUpdate((draft) => {
    if (draft.finalized) throw new Error('Calendar is finalised and locked.');
    const turn = getCurrentTurnMember(draft);
    const target = draft.staff.find(s => s.id === me.id);
    if (!target) throw new Error('Staff profile not found.');
    if (target.confirmedAt) throw new Error('Your leave dates are already confirmed.');
    if (!turn || turn.id !== target.id) {
      throw new Error(`It is currently ${turn ? turn.name + ' (#' + pad2(turn.luckyNumber) + ')' : 'another colleague'}'s turn.`);
    }

    const r1 = p1Payload ? validatePeriodBlock(p1Payload.start, p1Payload.end, 'Period 1', target.id, draft) : { active: false, valid: false, workingDays: 0 };
    const r2 = p2Payload ? validatePeriodBlock(p2Payload.start, p2Payload.end, 'Period 2', target.id, draft) : { active: false, valid: true, workingDays: 0 };

    if (!r1.active || !r1.valid) throw new Error(r1.error || 'Period 1 is invalid.');
    if (p2Payload && !r2.valid) throw new Error(r2.error || 'Period 2 is invalid.');
    if (p1Payload && p2Payload && !(p1Payload.end < p2Payload.start || p2Payload.end < p1Payload.start)) {
      throw new Error('First and second leave periods cannot overlap.');
    }

    const total = r1.workingDays + (p2Payload ? r2.workingDays : 0);
    if (total < 1 || total > MAX_ENTITLEMENT_DAYS) {
      throw new Error(`Working days must be between 1 and ${MAX_ENTITLEMENT_DAYS}.`);
    }

    target.period1 = p1Payload;
    target.period2 = p2Payload;
    target.confirmedAt = new Date().toISOString();
    target.needsHolidayReview = false;
    draft.activity.unshift({
      at: new Date().toISOString(),
      actor: currentUser.email,
      text: `${target.name} (#${pad2(target.luckyNumber)}) confirmed ${total} working days`
    });
  }, `Confirmed ${check.totalWorking} working days for ${me.name}!`);
}

async function saveJan2028PolicyFromInputs() {
  const staffLim = Number(document.getElementById('jan28StaffLimit')?.value);
  const maxDays = Number(document.getElementById('jan28MaxDays')?.value);
  const maxEnd = document.getElementById('jan28MaxEnd')?.value || MAX_ALLOWED_DATE;
  const carryoverOnly = Boolean(document.getElementById('jan28CarryoverOnly')?.checked);

  if (!staffLim || staffLim < 1 || staffLim > 21) return showToast('Jan 2028 staff limit must be 1–21.', 'err');
  if (!maxDays || maxDays < 1 || maxDays > 31) return showToast('Jan 2028 max days must be 1–31.', 'err');
  if (maxEnd < '2028-01-01' || maxEnd > MAX_ALLOWED_DATE) return showToast('Jan 2028 end date must be in Jan 2028 (never Feb 2028+).', 'err');

  await runAtomicPlannerUpdate((draft) => {
    draft.jan2028Policy = {
      staffLimit: staffLim,
      maxDaysInJan: maxDays,
      maxEndDate: maxEnd,
      carryoverOnly
    };
    draft.activity.unshift({
      at: new Date().toISOString(),
      actor: currentUser.email,
      text: `Manager updated Jan 2028 policy: max ${staffLim} staff, max ${maxDays}d up to ${maxEnd}`
    });
  }, 'Saved Jan 2028 leave rules!');
}

async function toggleStaffSpinPermission(staffId) {
  await runAtomicPlannerUpdate((draft) => {
    const s = draft.staff.find(x => x.id === Number(staffId));
    if (!s) throw new Error('Staff not found.');
    if (s.confirmedAt) {
      throw new Error(`Reopen ${s.name}'s confirmed booking first before blocking.`);
    }
    s.canSpin = !s.canSpin;
    if (!s.canSpin) {
      s.luckyNumber = null;
      s.spunAt = null;
    }
    const activeSpun = draft.staff
      .filter(x => x.canSpin !== false && x.luckyNumber !== null)
      .sort((a, b) => a.luckyNumber - b.luckyNumber);
    activeSpun.forEach((member, idx) => {
      member.luckyNumber = idx + 1;
    });
    draft.activity.unshift({
      at: new Date().toISOString(),
      actor: currentUser.email,
      text: `Manager set ${s.name} spin participation to ${s.canSpin ? 'Allowed' : 'Blocked'}`
    });
  }, 'Updated spin participation!');
}

async function reopenStaffSelection(staffId) {
  await runAtomicPlannerUpdate((draft) => {
    if (draft.finalized) throw new Error('Reopen the finalised calendar first.');
    const s = draft.staff.find(x => x.id === Number(staffId));
    if (!s) throw new Error('Staff not found.');
    s.period1 = null;
    s.period2 = null;
    s.confirmedAt = null;
    s.needsHolidayReview = false;
    draft.activity.unshift({
      at: new Date().toISOString(),
      actor: currentUser.email,
      text: `Manager reopened date selection for ${s.name}`
    });
  }, 'Reopened staff leave selection!');
}

async function updateStaffEmail(staffId, newEmail) {
  const clean = String(newEmail || '').trim().toLowerCase();
  if (!clean || !clean.includes('@')) return showToast('Enter a valid Gmail address.', 'err');
  const norm = normalizeEmail(clean);
  await runAtomicPlannerUpdate((draft) => {
    const dup = draft.staff.find(x => x.id !== Number(staffId) && normalizeEmail(x.email) === norm);
    if (dup) throw new Error(`Duplicate Gmail already used by ${dup.name}.`);
    const s = draft.staff.find(x => x.id === Number(staffId));
    if (s) s.email = clean;
  }, 'Saved registered Gmail address!');
}

async function autoSpinRemainingStaff() {
  await runAtomicPlannerUpdate((draft) => {
    const active = draft.staff.filter(s => s.canSpin !== false);
    const used = new Set(active.map(s => s.luckyNumber).filter(n => n !== null));
    const pool = [];
    for (let i = 1; i <= active.length; i++) {
      if (!used.has(i)) pool.push(i);
    }
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    active.forEach(s => {
      if (s.luckyNumber === null && pool.length > 0) {
        s.luckyNumber = pool.pop();
        s.spunAt = new Date().toISOString();
      }
    });
    draft.activity.unshift({
      at: new Date().toISOString(),
      actor: currentUser.email,
      text: 'Manager auto-assigned remaining lucky numbers'
    });
  }, 'All active staff now have lucky numbers!');
}

async function saveMonthlyLimitsFromInputs() {
  const inputs = document.querySelectorAll('.month-lim-input');
  const nextLimits = { ...state.monthLimits };
  inputs.forEach(inp => {
    nextLimits[Number(inp.dataset.month)] = Number(inp.value);
  });

  await runAtomicPlannerUpdate((draft) => {
    let conflict = null;
    eachDateInRange('2027-01-01', '2027-12-31', d => {
      if (conflict) return;
      const eff = (draft.dateLimits && draft.dateLimits[d] !== undefined)
        ? draft.dateLimits[d]
        : nextLimits[Number(d.slice(5, 7))];
      const booked = getStaffOnLeaveOnDate(d, null, draft).length;
      if (eff < booked) conflict = { d, booked, eff };
    });
    if (conflict) {
      throw new Error(`Cannot reduce limit on ${conflict.d} to ${conflict.eff} (${conflict.booked} already booked).`);
    }
    draft.monthLimits = nextLimits;
    draft.activity.unshift({
      at: new Date().toISOString(),
      actor: currentUser.email,
      text: 'Manager updated monthly slot limits'
    });
  }, 'Monthly slot limits saved!');
  managerSub = 'MAIN';
  renderApp();
}

async function saveQuickDateLimit() {
  const startEl = document.getElementById('mgrLimStart');
  const endEl = document.getElementById('mgrLimEnd');
  const valEl = document.getElementById('mgrLimVal');
  if (!startEl || !valEl) return;
  const s = startEl.value;
  const e = endEl && endEl.value ? endEl.value : s;
  const lim = Number(valEl.value);
  if (!s) return showToast('Please choose a date or start date.', 'warn');
  if (s > e) return showToast('Start date cannot be after end date.', 'err');
  if (e > MAX_ALLOWED_DATE) return showToast('Overrides cannot go past 31 Jan 2028.', 'err');
  if (isNaN(lim) || lim < 0) return showToast('Invalid slot limit.', 'err');

  await runAtomicPlannerUpdate((draft) => {
    let conflict = null;
    eachDateInRange(s, e, d => {
      const booked = getStaffOnLeaveOnDate(d, null, draft).length;
      if (lim < booked && !conflict) conflict = { d, booked };
    });
    if (conflict) {
      throw new Error(`Cannot set limit to ${lim} on ${conflict.d} (${conflict.booked} staff already booked).`);
    }
    draft.dateLimits = draft.dateLimits || {};
    eachDateInRange(s, e, d => {
      draft.dateLimits[d] = lim;
    });
    draft.activity.unshift({
      at: new Date().toISOString(),
      actor: currentUser.email,
      text: `Manager set daily slot limit of ${lim} for ${s} to ${e}`
    });
  }, `Saved slot limit (${lim} staff) for ${s}${e !== s ? ' to ' + e : ''}`);
}

async function removeDateLimitOverride(iso) {
  await runAtomicPlannerUpdate((draft) => {
    const month = Number(iso.slice(5, 7));
    const fallback = iso.startsWith('2028-01-')
      ? getJan2028PolicyForState(draft).staffLimit
      : ((draft.monthLimits && draft.monthLimits[month]) || 2);
    const booked = getStaffOnLeaveOnDate(iso, null, draft).length;
    if (fallback < booked) {
      throw new Error(`Cannot remove override on ${iso}: ${booked} booked exceeds limit ${fallback}.`);

    if (draft.dateLimits) delete draft.dateLimits[iso];
  }, 'Removed date slot override!');
}

async function addHolidayFromManager() {

    draft.holidays = draft.holidays || [];
    draft.holidays.push({ date: dt, name: nm });
    draft.holidays.sort((a, b) => a.date.localeCompare(b.date));

function dateToYearFraction(iso) {
  const dt = parseIsoUTC(iso);
  const start = Date.UTC(2027, 0, 1);
  const dayIndex = Math.max(0, Math.min(GANTT_TOTAL_DAYS - 1, Math.floor((dt.getTime() - start) / 86400000)));
  return dayIndex / GANTT_TOTAL_DAYS;
}

function formatGanttPillLabel(startIso, endIso, workingDaysCount = null) {
  if (!startIso || !endIso) return '';
  const mShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const s = parseIsoUTC(startIso);
  const e = parseIsoUTC(endIso);
  const sYr = s.getUTCFullYear() === 2028 ? ' ’28' : '';
  const eYr = e.getUTCFullYear() === 2028 ? ' ’28' : '';
  const days = (workingDaysCount !== null && workingDaysCount !== undefined)
    ? workingDaysCount
    : calculateWorkingDays(startIso, endIso, state.holidays).workingDays;
  return `${s.getUTCDate()} ${mShort[s.getUTCMonth()]}${sYr} to ${e.getUTCDate()} ${mShort[e.getUTCMonth()]}${eYr} (${days}d)`;
}

function getGanttPeriodsForStaff(s) {
  const periods = [];
  if (s.confirmedAt && s.period1) {
    const d1 = calculateWorkingDays(s.period1.start, s.period1.end, state.holidays).workingDays;
    periods.push({ start: s.period1.start, end: s.period1.end, days: d1, color: 'p1' });
  }
  if (s.confirmedAt && s.period2) {
    const d2 = calculateWorkingDays(s.period2.start, s.period2.end, state.holidays).workingDays;
    periods.push({ start: s.period2.start, end: s.period2.end, days: d2, color: 'p2' });
  }
  return periods;
}

function downloadPdfExport() {
  if (!window.jspdf) return showToast('PDF library still loading, try again in a moment.', 'warn');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const statusTag = state.finalized ? 'FINAL' : 'DRAFT';

  doc.setFillColor(79, 70, 229);
  doc.roundedRect(10, 10, 277, 9, 2, 2, 'F');
  doc.setFontSize(12);
  doc.setTextColor(255, 255, 255);
  doc.text(`${EXPORT_TITLE} — 2027–Jan 2028 Gantt Chart (${statusTag})`, 14, 16);

  const tableX = 10, noColW = 10, nameColW = 38, chartX = tableX + noColW + nameColW, chartW = 229, headerY = 21, headerH = 7, rowH = 8.0;

  doc.setFillColor(67, 56, 202);
  doc.rect(tableX, headerY, noColW, headerH, 'FD');
  doc.rect(tableX + noColW, headerY, nameColW, headerH, 'FD');
  doc.setFontSize(7.5);
  doc.setTextColor(255, 255, 255);
  doc.text('No.', tableX + noColW / 2, headerY + 4.8, { align: 'center' });
  doc.text('Staff Name', tableX + noColW + nameColW / 2, headerY + 4.8, { align: 'center' });

  let dayCursor = 0;
  GANTT_MONTH_SEGMENTS.forEach((seg) => {
    const mx = chartX + (dayCursor / GANTT_TOTAL_DAYS) * chartW;
    const mw = (seg.days / GANTT_TOTAL_DAYS) * chartW;
    doc.setFillColor(67, 56, 202);
    doc.setDrawColor(129, 140, 248);
    doc.rect(mx, headerY, mw, headerH, 'FD');
    doc.text(seg.label, mx + mw / 2, headerY + 4.8, { align: 'center' });
    dayCursor += seg.days;
  });

  state.staff.forEach((s, idx) => {
    const ry = headerY + headerH + idx * rowH;
    const isEven = idx % 2 === 0;
    doc.setDrawColor(224, 231, 255);
    doc.setFillColor(isEven ? 245 : 255, isEven ? 243 : 255, isEven ? 255 : 255);
    doc.rect(tableX, ry, noColW, rowH, 'FD');
    doc.rect(tableX + noColW, ry, nameColW, rowH, 'FD');

    let dc = 0;
    GANTT_MONTH_SEGMENTS.forEach((seg) => {
      const mx = chartX + (dc / GANTT_TOTAL_DAYS) * chartW;
      const mw = (seg.days / GANTT_TOTAL_DAYS) * chartW;
      doc.setFillColor(isEven ? 245 : 255, isEven ? 243 : 255, isEven ? 255 : 255);
      doc.rect(mx, ry, mw, rowH, 'FD');
      dc += seg.days;
    });

    doc.setFontSize(7.5);
    doc.setTextColor(30, 27, 75);
    doc.text(String(s.id), tableX + noColW / 2, ry + 5.2, { align: 'center' });
    doc.text(s.name, tableX + noColW + 2.5, ry + 5.2);

    const periods = getGanttPeriodsForStaff(s);
    periods.forEach(p => {
      const fStart = dateToYearFraction(p.start);
      const fEnd = dateToYearFraction(p.end) + (1 / GANTT_TOTAL_DAYS);
      const bx = chartX + fStart * chartW;
      const bw = Math.max(22, (fEnd - fStart) * chartW);
      if (p.color === 'p2') {
        doc.setFillColor(245, 158, 11);
      } else {
        doc.setFillColor(16, 185, 129);
      }
      doc.roundedRect(bx, ry + 1.2, bw, rowH - 2.4, 2.2, 2.2, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(5.5);
      doc.text(formatGanttPillLabel(p.start, p.end, p.days), bx + bw / 2, ry + 5.0, { align: 'center' });
    });
  });

  doc.addPage();
  doc.setTextColor(30, 27, 75);
  doc.setFontSize(14);
  doc.text(`${EXPORT_TITLE} — Staff Summary (${statusTag})`, 14, 14);
  doc.setFontSize(8.5);
  let y = 22;
  state.staff.forEach(s => {
    const d1 = s.period1 ? calculateWorkingDays(s.period1.start, s.period1.end, state.holidays).workingDays : 0;
    const d2 = s.period2 ? calculateWorkingDays(s.period2.start, s.period2.end, state.holidays).workingDays : 0;
    const p1 = s.period1 ? `${s.period1.start} to ${s.period1.end} (${d1}d)` : '—';
    const p2 = s.period2 ? `${s.period2.start} to ${s.period2.end} (${d2}d)` : '—';
    const stText = s.canSpin === false ? 'Excluded' : (s.confirmedAt ? 'Confirmed' : 'Pending');
    doc.text(`${s.id}. ${s.name} | ${s.luckyNumber ? '#' + pad2(s.luckyNumber) : '—'} | P1: ${p1} | P2: ${p2} | Taken: ${d1 + d2}/30d | ${stText}`, 14, y);
    y += 6.2;
  });

  doc.save(`${EXPORT_TITLE} (${statusTag}).pdf`);
  showToast('Downloaded PDF report!');
}

function downloadExcelExport() {
  if (!window.XLSX) return showToast('Excel library still loading, try again in a moment.', 'warn');
  const wb = XLSX.utils.book_new();
  const statusTag = state.finalized ? 'FINAL' : 'DRAFT';
  const summaryRows = [
    [`${EXPORT_TITLE} (${statusTag})`],
    ['ID', 'Staff Name', 'Participates', 'Lucky #', 'Period 1 Start', 'Period 1 End', 'Period 1 Working Days', 'Period 2 Start', 'Period 2 End', 'Period 2 Working Days', 'Total Working Days Taken', 'Unused Days (of 30)', 'Status']
  ];
  state.staff.forEach(s => {
    const d1 = s.period1 ? calculateWorkingDays(s.period1.start, s.period1.end, state.holidays).workingDays : 0;
    const d2 = s.period2 ? calculateWorkingDays(s.period2.start, s.period2.end, state.holidays).workingDays : 0;
    const tot = d1 + d2;
    summaryRows.push([
      s.id, s.name, s.canSpin !== false ? 'Yes' : 'No',
      s.luckyNumber ? pad2(s.luckyNumber) : '',
      s.period1 ? s.period1.start : '', s.period1 ? s.period1.end : '', d1,
      s.period2 ? s.period2.start : '', s.period2 ? s.period2.end : '', d2,
      tot, s.confirmedAt ? (MAX_ENTITLEMENT_DAYS - tot) : '',
      s.canSpin === false ? 'Excluded' : (s.confirmedAt ? 'Confirmed' : 'Pending')
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Staff Summary');

  const holMap = {};
  state.holidays.forEach(h => { holMap[h.date] = h.name; });
  const dailyRows = [['Date', 'Day', 'Holiday Name', 'Booked Count', 'Daily Slot Limit', 'Staff on Leave']];
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  eachDateInRange('2027-01-01', MAX_ALLOWED_DATE, d => {
    const dow = dayNames[parseIsoUTC(d).getUTCDay()];
    const onLeave = getStaffOnLeaveOnDate(d);
    dailyRows.push([d, dow, holMap[d] || '', onLeave.length, getDailyLimit(d), onLeave.join(', ')]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dailyRows), 'Calendar & Jan 2028');

  XLSX.writeFile(wb, `${EXPORT_TITLE} (${statusTag}).xlsx`);
  showToast('Downloaded Excel (.xlsx) workbook!');
}

        <button onclick="staffTab='TEAM_CAL';renderApp()" class="py-2.5 font-extrabold text-xs ${staffTab === 'TEAM_CAL' ? 'btn-liquid-primary' : 'btn-liquid-soft'}">Team calendar</button>
      </div>
    </div>`;

  if (staffTab === 'TEAM_CAL') return tabs + `<div class="p-4 flex-1">${renderTeamCalendarTab()}</div>`;
  return tabs + `<div class="p-4 flex-1">${renderMyLeaveTab(me)}</div>`;
}

function renderInlineAvailabilityMiniCalendar(staffId) {
  const monthKeys = [
    '2027-01','2027-02','2027-03','2027-04','2027-05','2027-06',
    '2027-07','2027-08','2027-09','2027-10','2027-11','2027-12','2028-01'
  ];
  const monthLabels = {
    '2027-01': 'Jan 2027', '2027-02': 'Feb 2027', '2027-03': 'Mar 2027', '2027-04': 'Apr 2027',
    '2027-05': 'May 2027', '2027-06': 'Jun 2027', '2027-07': 'Jul 2027', '2027-08': 'Aug 2027',
    '2027-09': 'Sep 2027', '2027-10': 'Oct 2027', '2027-11': 'Nov 2027', '2027-12': 'Dec 2027',
    '2028-01': 'Jan 2028 (Carryover)'
  };

  const curIdx = Math.max(0, monthKeys.indexOf(pickerMonthKey));
  const mKey = monthKeys[curIdx];
  const [yr, mo] = mKey.split('-').map(Number);
  const daysInMonth = new Date(Date.UTC(yr, mo, 0)).getUTCDate();
  const firstDow = new Date(Date.UTC(yr, mo - 1, 1)).getUTCDay();
  const holMap = {};
  state.holidays.forEach(h => { holMap[h.date] = h.name; });

  const inSelectedRange = (iso) => {
    const in1 = leaveForm.p1Start && leaveForm.p1End && iso >= leaveForm.p1Start && iso <= leaveForm.p1End;
    const in2 = leaveForm.p2Enabled && leaveForm.p2Start && leaveForm.p2End && iso >= leaveForm.p2Start && iso <= leaveForm.p2End;
    return in1 || in2;
  };

  const targetLabels = {
    p1Start: 'P1 First Day',
    p1End: 'P1 Last Day',
    p2Start: 'P2 First Day',
    p2End: 'P2 Last Day'
  };

  const inspBooked = getStaffOnLeaveOnDate(selectedCalDate, staffId);
  const inspLimit = getDailyLimit(selectedCalDate);
  const inspHol = holMap[selectedCalDate] || '';

  return `
    <div class="glass-Tint p-3 mb-3">
      <div class="flex items-center justify-between gap-1.5 mb-2">
        <button type="button" onclick="pickerMonthKey='${monthKeys[Math.max(0, curIdx - 1)]}';renderApp()" class="px-2.5 py-1 btn-liquid-soft text-xs font-extrabold">&lt;</button>
        <div class="text-xs font-extrabold text-indigo-950 text-center">${monthLabels[mKey]}</div>
        <button type="button" onclick="pickerMonthKey='${monthKeys[Math.min(monthKeys.length - 1, curIdx + 1)]}';renderApp()" class="px-2.5 py-1 btn-liquid-soft text-xs font-extrabold">&gt;</button>
      </div>

      <div class="flex flex-wrap gap-1 mb-2">
        <span class="text-[10px] font-bold text-slate-500 self-center mr-0.5">Tap fills:</span>
        <button type="button" onclick="activePickTarget='p1Start';renderApp()" class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${activePickTarget === 'p1Start' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700 border border-slate-200'}">P1 Start</button>
        <button type="button" onclick="activePickTarget='p1End';renderApp()" class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${activePickTarget === 'p1End' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700 border border-slate-200'}">P1 End</button>
        <button type="button" onclick="activePickTarget='p2Start';leaveForm.p2Enabled=true;renderApp()" class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${activePickTarget === 'p2Start' ? 'bg-purple-600 text-white' : 'bg-white text-slate-700 border border-slate-200'}">P2 Start</button>
        <button type="button" onclick="activePickTarget='p2End';leaveForm.p2Enabled=true;renderApp()" class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${activePickTarget === 'p2End' ? 'bg-purple-600 text-white' : 'bg-white text-slate-700 border border-slate-200'}">P2 End</button>
      </div>

      <div class="grid grid-cols-7 gap-1 text-center mb-1">
        ${['S','M','T','W','T','F','S'].map(d => `<div class="text-[10px] font-extrabold text-slate-400">${d}</div>`).join('')}
      </div>

      <div class="grid grid-cols-7 gap-1">
        ${Array(firstDow).fill('<div></div>').join('')}
        ${Array.from({ length: daysInMonth }, (_, idx) => {
          const day = idx + 1;
          const iso = `${yr}-${pad2(mo)}-${pad2(day)}`;
          const dow = new Date(Date.UTC(yr, mo - 1, day)).getUTCDay();
          const isWknd = dow === 5 || dow === 6;
          const isHol = Boolean(holMap[iso]);
          const booked = getStaffOnLeaveOnDate(iso, staffId);
          const lim = getDailyLimit(iso);
          const isFull = booked.length >= lim;
          const isLow = !isFull && (lim - booked.length === 1);
          const picked = inSelectedRange(iso);

          let cellCls = 'bg-white border-slate-200 text-slate-800';
          if (picked) cellCls = 'bg-indigo-600 border-indigo-700 text-white ring-2 ring-indigo-300';
          else if (isFull) cellCls = 'bg-rose-100 border-rose-300 text-rose-800';
          else if (isWknd) cellCls = 'bg-slate-200/75 border-slate-200 text-slate-400';
          else if (isHol) cellCls = 'bg-amber-100/90 border-amber-300 text-amber-900';
          else if (isLow) cellCls = 'bg-amber-50 border-amber-200 text-amber-900';
          else cellCls = 'bg-emerald-50/80 border-emerald-200 text-emerald-950';

          return `
            <div onclick="handleMiniCalendarDateClick('${iso}')"
              title="${iso}: ${booked.length}/${lim} booked${isHol ? ' · ' + holMap[iso] : ''}"
              class="cal-tap rounded-lg border py-1 text-center leading-tight ${cellCls} ${iso === selectedCalDate ? 'ring-2 ring-purple-500' : ''}">
              <div class="text-[11px] font-extrabold">${day}</div>
              <div class="text-[8.5px] font-bold opacity-85">${isWknd ? 'W' : `${booked.length}/${lim}`}</div>
            </div>`;
        }).join('')}
      </div>

      <div class="flex flex-wrap items-center justify-between gap-1.5 mt-2 text-[9.5px] font-bold text-slate-600">
        <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-emerald-200 inline-block"></span>Open</span>
        <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-amber-100 border border-amber-300 inline-block"></span>1 Left / Holiday</span>
        <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-rose-200 border border-rose-300 inline-block"></span>Full</span>
        <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-slate-200 inline-block"></span>Fri/Sat</span>
      </div>

      <div class="mt-2 pt-2 border-t border-indigo-200/60 text-[11px] text-slate-700">
        <div>Inspecting <strong>${selectedCalDate}</strong> (${targetLabels[activePickTarget] || 'Date'}): <strong>${inspBooked.length}/${inspLimit}</strong> slots taken${inspBooked.length ? ` by <strong>${esc(inspBooked.join(', '))}</strong>` : ' (all open)'}.</div>
        ${inspHol ? `<div class="text-amber-800 font-bold">Public Holiday: ${esc(inspHol)}</div>` : ''}
      </div>
    </div>`;
}

function renderMyLeaveTab(me) {
  if (me.canSpin === false) {
    return `
      <div class="glass-card p-5 text-center border-rose-200 bg-rose-50/70">
        <div class="text-base font-extrabold text-rose-800 mb-1">Participation Disabled</div>
        <p class="text-xs text-rose-600">The manager has excluded your account from participating in the spin.</p>
      </div>`;
  }

  const activeStaff = getActiveParticipants();
  const totalActive = activeStaff.length;
  const spunStaff = activeStaff.filter(s => s.luckyNumber !== null).sort((a, b) => a.luckyNumber - b.luckyNumber);
  const spunCount = spunStaff.length;
  const allSpun = spunCount === totalActive && totalActive > 0;
  const currentTurn = getCurrentTurnMember();

  if (me.luckyNumber === null) {
    return `
      <div class="glass-Tint p-5 text-center mb-3.5">
        <span class="inline-block bg-white/80 text-indigo-700 text-[11px] font-extrabold px-3 py-1 rounded-full mb-1 shadow-xs">

        </span>
        <h2 class="text-xl font-extrabold text-slate-900 mb-1">Your turn to spin</h2>
        <div class="my-5 flex justify-center">
          <div class="wheel-ring" id="spinWheelRing" style="transform: rotate(${wheelAngle}deg);">
            <div class="wheel-hub" id="spinWheelHub">${rollingDisplay}</div>
          </div>
        </div>
        <button onclick="handleSpinClick()" ${isSpinning || !state.drawOpen ? 'disabled' : ''} class="w-full btn-liquid-primary font-extrabold py-3.5 text-sm">
          ${isSpinning ? 'Spinning Wheel…' : 'Spin for My Lucky Number'}
        </button>
        <div class="mt-3 bg-white/75 text-indigo-800 font-bold text-xs py-2 px-3 rounded-xl">
          ${spunCount} of ${totalActive} staff have spun
        </div>
      </div>

      <div class="glass-card overflow-hidden">
        <div class="bg-indigo-50/80 px-4 py-2.5 font-extrabold text-xs text-indigo-900 border-b border-indigo-100">
          Live Draw Results (${spunCount})
        </div>
        <div class="divide-y divide-slate-100">
          ${spunStaff.length === 0 ? '<div class="p-4 text-xs text-slate-400 text-center">No one has spun yet. Be the first!</div>' : spunStaff.map(s => `
            <div class="px-4 py-2.5 flex justify-between items-center text-xs font-bold">
              <span class="text-slate-800">${esc(s.name)}</span>
              <span class="bg-indigo-100 text-indigo-800 px-2.5 py-0.5 rounded-full font-extrabold">#${pad2(s.luckyNumber)}</span>
            </div>
          `).join('')}
        </div>
      </div>`;
  }

  if (me.confirmedAt && me.period1) {
    const d1 = calculateWorkingDays(me.period1.start, me.period1.end, state.holidays).workingDays;
    const d2 = me.period2 ? calculateWorkingDays(me.period2.start, me.period2.end, state.holidays).workingDays : 0;
    const totalTaken = d1 + d2;
    return `
      <div class="btn-liquid-teal p-4 mb-3.5 flex items-center justify-between">
        <span class="font-extrabold text-sm">${esc(me.name)} &middot; Lucky #${pad2(me.luckyNumber)}</span>
        <span class="bg-white/25 px-2.5 py-0.5 rounded-full text-xs font-bold">Confirmed &#10003;</span>
      </div>

      <div class="glass-card p-4 mb-3.5">
        <h3 class="font-extrabold text-sm text-slate-900 mb-2">My Confirmed Leave</h3>
        <div class="py-2 border-b border-slate-100 flex justify-between text-xs">
          <span class="text-slate-600">First period (${me.period1.start} to ${me.period1.end})</span>
          <strong class="text-emerald-700">${d1} working days</strong>
        </div>
        ${me.period2 ? `
          <div class="py-2 border-b border-slate-100 flex justify-between text-xs">
            <span class="text-slate-600">Second period (${me.period2.start} to ${me.period2.end})</span>
            <strong class="text-amber-600">${d2} working days</strong>
          </div>
        ` : `<div class="py-2 border-b border-slate-100 text-[11px] text-slate-400">Second period: Not taken</div>`}
        <div class="mt-3 bg-indigo-50 text-indigo-900 font-extrabold text-xs py-2.5 px-3 rounded-xl text-center">
          Total Taken &middot; ${totalTaken} working days ${totalTaken < MAX_ENTITLEMENT_DAYS ? `(${MAX_ENTITLEMENT_DAYS - totalTaken} days unused)` : '(Full 30-day allowance)'}
        </div>
      </div>

      <button onclick="staffTab='TEAM_CAL';renderApp()" class="w-full btn-liquid-soft py-3 font-extrabold text-xs">
        View Team Calendar &amp; Cute Gantt
      </button>`;
  }

  const isMyTurn = allSpun && currentTurn && currentTurn.id === me.id;

  if (!isMyTurn) {
    return `
      <div class="glass-Tint p-5 text-center mb-3.5">
        <div class="text-xs font-bold text-indigo-700">Your Lucky Number</div>
        <div class="text-5xl font-black bg-gradient-to-r from-indigo-600 to-pink-600 bg-clip-text text-transparent my-1.5">#${pad2(me.luckyNumber)}</div>
        <p class="text-xs font-semibold text-slate-600">
          ${!allSpun
            ? `Waiting for ${totalActive - spunCount} remaining staff to spin before date selection opens.`
            : `Currently, <strong>${currentTurn ? esc(currentTurn.name) + ' (#' + pad2(currentTurn.luckyNumber) + ')' : 'another colleague'}</strong> is selecting their dates.`}
        </p>
      </div>

      <div class="glass-card overflow-hidden">
        <div class="bg-indigo-50/80 px-4 py-2.5 font-extrabold text-xs text-indigo-900 border-b border-indigo-100">
          Department Turn Order (${spunCount}/${totalActive} spun)
        </div>
        <div class="divide-y divide-slate-100">
          ${spunStaff.map(s => `
            <div class="px-4 py-2.5 flex justify-between items-center text-xs font-bold ${s.id === me.id ? 'bg-indigo-50/70' : ''}">
              <span>#${pad2(s.luckyNumber)} &middot; ${esc(s.name)} ${s.id === me.id ? '(You)' : ''}</span>
              <span class="${s.confirmedAt ? 'text-emerald-600' : (currentTurn?.id === s.id ? 'text-amber-600' : 'text-slate-400')}">
                ${s.confirmedAt ? 'Booked &#10003;' : (currentTurn?.id === s.id ? 'Choosing now' : 'Waiting')}
              </span>
            </div>
          `).join('')}
        </div>
      </div>`;
  }

  ensureLeaveFormInitialized(me.id);
  const check = validateCurrentLeaveForm(me.id);
  const p1 = check.p1;
  const p2 = check.p2;
  const remainingDays = Math.max(0, MAX_ENTITLEMENT_DAYS - (p1.valid ? p1.workingDays : 0) - (p2.valid ? p2.workingDays : 0));

  return `
    <div class="btn-liquid-primary p-3.5 mb-3 flex items-center justify-between">
      <span class="font-extrabold text-xs">${esc(me.name)} &middot; #${pad2(me.luckyNumber)} &middot; Your Turn!</span>
      <button type="button" onclick="clearLeaveFormDates()" class="bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-full text-[10px] font-extrabold">Clear All</button>
    </div>

    <p class="text-[11px] text-slate-500 mb-2.5 font-medium">
      Pick <strong>1 to 30 working days</strong> (less than 30 is allowed). Period 2 is optional. Late Dec 2027 can continue into Jan 2028 if permitted by manager.
    </p>

    ${renderInlineAvailabilityMiniCalendar(me.id)}

    <div class="glass-card p-3.5 mb-3">
      <div class="flex items-center justify-between mb-2">
        <span class="font-extrabold text-xs text-slate-800">First Leave Period</span>
        <span class="bg-emerald-100 text-emerald-800 font-extrabold text-[11px] px-2.5 py-0.5 rounded-full">
          ${p1.valid ? p1.workingDays : 0} working days
        </span>
      </div>
      <div class="grid grid-cols-2 gap-2 mb-2">
        <div>
          <label class="text-[10px] font-bold text-slate-500 block mb-1">First day</label>
          <input type="date" min="2027-01-01" max="${MAX_ALLOWED_DATE}" value="${leaveForm.p1Start}"
            oninput="leaveForm.p1Start=this.value;if(this.value)pickerMonthKey=this.value.slice(0,7);renderApp()" />
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-500 block mb-1">Last day</label>
          <input type="date" min="2027-01-01" max="${MAX_ALLOWED_DATE}" value="${leaveForm.p1End}"
            oninput="leaveForm.p1End=this.value;if(this.value)pickerMonthKey=this.value.slice(0,7);renderApp()" />
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-1.5 mt-2">
        <input type="number" min="1" max="30" placeholder="Days" value="${leaveForm.p1CustomDays}"
          oninput="leaveForm.p1CustomDays=this.value"
          class="w-16 py-1 px-2 text-[11px] font-bold" />
        <button type="button" onclick="applyPeriodDays(1, document.activeElement.previousElementSibling.value || leaveForm.p1CustomDays)"
          class="px-2 py-1 btn-liquid-soft text-[10px] font-extrabold">Set Days</button>
        <button type="button" onclick="applyPeriodDays(1, 10)" class="px-2 py-1 btn-liquid-soft text-[10px] font-extrabold">10d</button>
        <button type="button" onclick="applyPeriodDays(1, 15)" class="px-2 py-1 btn-liquid-soft text-[10px] font-extrabold">15d</button>
        <button type="button" onclick="applyPeriodDays(1, 20)" class="px-2 py-1 btn-liquid-soft text-[10px] font-extrabold">20d</button>
        <button type="button" onclick="applyPeriodDays(1, 30)" class="px-2 py-1 btn-liquid-soft text-[10px] font-extrabold">30d</button>
      </div>

      ${p1.active ? `
        <div class="mt-2.5 pt-2 border-t border-slate-100 text-[11px] font-bold ${p1.valid ? 'text-emerald-700' : 'text-rose-600'}">
          ${p1.valid
            ? `&#10003; Period 1 valid: ${p1.workingDays} working days (${p1.calendarDays} cal days)${p1.jan2028Days ? ` · ${p1.jan2028Days}d in Jan 2028` : ''}`
            : `&#9888; ${esc(p1.error)}`}
        </div>
      ` : ''}
    </div>

    <div class="glass-card p-3.5 mb-3">
      <div class="flex items-center justify-between mb-2">
        <span class="font-extrabold text-xs text-slate-800">Second Leave Period <span class="text-slate-400 font-semibold">(Optional)</span></span>
        <span class="bg-amber-100 text-amber-800 font-extrabold text-[11px] px-2.5 py-0.5 rounded-full">
          ${leaveForm.p2Enabled && p2.valid ? p2.workingDays : 0} working days
        </span>
      </div>
      ${!leaveForm.p2Enabled ? `
        <button type="button" onclick="leaveForm.p2Enabled=true;activePickTarget='p2Start';renderApp()" class="w-full py-2.5 btn-liquid-soft font-extrabold text-xs">
          + Add Second Leave Period (Optional)
        </button>
      ` : `
        <div class="grid grid-cols-2 gap-2 mb-2">
          <div>
            <label class="text-[10px] font-bold text-slate-500 block mb-1">First day</label>
            <input type="date" min="2027-01-01" max="${MAX_ALLOWED_DATE}" value="${leaveForm.p2Start}"

          </div>
          <div>
            <label class="text-[10px] font-bold text-slate-500 block mb-1">Last day</label>
            <input type="date" min="2027-01-01" max="${MAX_ALLOWED_DATE}" value="${leaveForm.p2End}"
              oninput="leaveForm.p2End=this.value;if(this.value)pickerMonthKey=this.value.slice(0,7);renderApp()" />
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-1.5 mt-2">
          <input type="number" min="1" max="30" placeholder="Days" value="${leaveForm.p2CustomDays}"
            oninput="leaveForm.p2CustomDays=this.value"
            class="w-16 py-1 px-2 text-[11px] font-bold" />
          <button type="button" onclick="applyPeriodDays(2, document.activeElement.previousElementSibling.value || leaveForm.p2CustomDays)"
            class="px-2 py-1 btn-liquid-soft text-[10px] font-extrabold">Set Days</button>
          <button type="button" onclick="applyPeriodDays(2, 10)" class="px-2 py-1 btn-liquid-soft text-[10px] font-extrabold">10d</button>
          <button type="button" onclick="applyPeriodDays(2, 15)" class="px-2 py-1 btn-liquid-soft text-[10px] font-extrabold">15d</button>
          ${remainingDays > 0 ? `
            <button type="button" onclick="applyPeriodDays(2, ${remainingDays})" class="px-2 py-1 btn-liquid-soft text-[10px] font-extrabold">Rem (${remainingDays}d)</button>
          ` : ''}
          <button type="button" onclick="leaveForm.p2Enabled=false;leaveForm.p2Start='';leaveForm.p2End='';leaveForm.p2CustomDays='';renderApp()" class="text-[10px] font-extrabold text-rose-600 ml-auto px-2 py-1">Remove</button>
        </div>
        ${p2.active ? `
          <div class="mt-2.5 pt-2 border-t border-slate-100 text-[11px] font-bold ${p2.valid ? 'text-emerald-700' : 'text-rose-600'}">
            ${p2.valid
              ? `&#10003; Period 2 valid: ${p2.workingDays} working days (${p2.calendarDays} cal days)${p2.jan2028Days ? ` · ${p2.jan2028Days}d in Jan 2028` : ''}`
              : `&#9888; ${esc(p2.error)}`}
          </div>
        ` : ''}
      `}
    </div>

    <div class="rounded-2xl p-3 text-center font-extrabold text-xs mb-2.5 ${check.canConfirm ? 'bg-emerald-100 text-emerald-900 border border-emerald-300' : 'bg-amber-100 text-amber-900 border border-amber-300'}">
      ${check.canConfirm ? '&#10003; ' : ''}${check.totalWorking} / ${MAX_ENTITLEMENT_DAYS} working days selected${check.canConfirm && check.totalWorking < MAX_ENTITLEMENT_DAYS ? ` (${MAX_ENTITLEMENT_DAYS - check.totalWorking} days left untaken — allowed)` : ''}
    </div>

    ${check.errors.length > 0 ? `
      <div class="text-xs font-bold text-rose-700 bg-rose-50 border border-rose-200 rounded-2xl p-3 mb-3 space-y-1">
        ${check.errors.map(e => `<div>&bull; ${esc(e)}</div>`).join('')}
      </div>
    ` : ''}

    <button type="button" onclick="confirmLeaveSelection()" ${!check.canConfirm ? 'disabled' : ''} class="w-full btn-liquid-primary font-extrabold py-3.5 text-sm">
      ${check.canConfirm ? `Confirm ${check.totalWorking} Working Day${check.totalWorking === 1 ? '' : 's'}` : 'Confirm Leave Dates'}
    </button>`;
}

function renderTeamCalendarTab() {
  const holMap = {};
  state.holidays.forEach(h => { holMap[h.date] = h.name; });

  const selDt = parseIsoUTC(selectedCalDate);
  const mNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const selBooked = getStaffOnLeaveOnDate(selectedCalDate);
  const selLimit = getDailyLimit(selectedCalDate);
  const selHol = holMap[selectedCalDate] || '';

  const modeButtons = `
    <div class="flex items-center justify-between gap-2 mb-3">
      <h2 class="text-base font-extrabold text-slate-900">Team Leave Schedule</h2>
      <div class="flex gap-1.5">
        <button onclick="calViewMode='WEEK';renderApp()" class="px-2.5 py-1.5 text-[11px] font-extrabold ${calViewMode === 'WEEK' ? 'btn-liquid-primary' : 'btn-liquid-soft'}">Week</button>
        <button onclick="calViewMode='MONTH';renderApp()" class="px-2.5 py-1.5 text-[11px] font-extrabold ${calViewMode === 'MONTH' ? 'btn-liquid-primary' : 'btn-liquid-soft'}">Month</button>
        <button onclick="calViewMode='GANTT';renderApp()" class="px-2.5 py-1.5 text-[11px] font-extrabold ${calViewMode === 'GANTT' ? 'btn-liquid-primary' : 'btn-liquid-soft'}">Gantt</button>
      </div>
    </div>`;

  if (calViewMode === 'GANTT') {
    return modeButtons + renderReferenceGanttTable(false);
  }

  let calGridHtml = '';
  if (calViewMode === 'WEEK') {
    const weekStartIso = addDays(selectedCalDate, -selDt.getUTCDay());
    const weekDates = Array.from({ length: 7 }, (_, i) => addDays(weekStartIso, i));
    const dStart = parseIsoUTC(weekDates[0]);
    const dEnd = parseIsoUTC(weekDates[6]);
    const sYr = dStart.getUTCFullYear() === 2028 ? ' ’28' : '';
    const eYr = dEnd.getUTCFullYear() === 2028 ? ' ’28' : '';
    const weekLabel = `${dStart.getUTCDate()} ${mNames[dStart.getUTCMonth()].slice(0, 3)}${sYr} – ${dEnd.getUTCDate()} ${mNames[dEnd.getUTCMonth()].slice(0, 3)}${eYr}`;

    calGridHtml = `
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <button onclick="const prev=addDays(selectedCalDate,-7);if(prev>='2027-01-01'){selectedCalDate=prev;renderApp()}" class="px-3 py-1.5 btn-liquid-soft font-extrabold text-xs">&lt;</button>
        <div class="flex-1 text-center bg-indigo-50 text-indigo-900 font-extrabold text-xs py-2 rounded-xl">${weekLabel}</div>
        <button onclick="const nxt=addDays(selectedCalDate,7);if(nxt<='2028-01-31'){selectedCalDate=nxt;renderApp()}" class="px-3 py-1.5 btn-liquid-soft font-extrabold text-xs">&gt;</button>
      </div>
      <div class="grid grid-cols-7 border border-indigo-100 rounded-2xl overflow-hidden bg-white shadow-xs">
        ${weekDates.map(iso => {
          const dt = parseIsoUTC(iso);
          const dow = dt.getUTCDay();
          const isWknd = dow === 5 || dow === 6;
          const isHol = Boolean(holMap[iso]);
          const names = getStaffOnLeaveOnDate(iso);
          const lim = getDailyLimit(iso);
          const blockedByRange = iso > MAX_ALLOWED_DATE;
          return `
            <div onclick="${blockedByRange ? '' : `selectedCalDate='${iso}';renderApp()`}"
              class="cal-tap min-h-[108px] p-1 border-r last:border-r-0 border-slate-100 flex flex-col items-center ${blockedByRange ? 'bg-slate-200/50 opacity-45' : (isWknd ? 'bg-slate-100/70' : (isHol ? 'bg-amber-50/80' : 'bg-white'))} ${iso === selectedCalDate ? 'ring-2 ring-inset ring-indigo-500' : ''}">
              <div class="text-[10px] font-extrabold text-slate-700">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dow]} ${dt.getUTCDate()}</div>
              <div class="text-[9px] font-bold text-slate-400 mb-1">${names.length}/${lim}</div>
              <div class="w-full flex flex-col gap-1">
                ${names.map(n => `<div class="bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-bold text-[9px] px-1 py-0.5 rounded-md truncate text-center shadow-2xs">${esc(n)}</div>`).join('')}
              </div>
            </div>`;
        }).join('')}
      </div>`;
  } else {
    const isJan28 = selectedCalDate.startsWith('2028-');
    const curMonth = isJan28 ? 13 : selDt.getUTCMonth() + 1;
    const yr = isJan28 ? 2028 : 2027;
    const mo = isJan28 ? 1 : curMonth;
    const daysInMonth = new Date(Date.UTC(yr, mo, 0)).getUTCDate();
    const firstDow = new Date(Date.UTC(yr, mo - 1, 1)).getUTCDay();

    const prevTarget = curMonth === 1 ? null : (curMonth === 13 ? '2027-12-01' : `2027-${pad2(curMonth - 1)}-01`);
    const nextTarget = curMonth === 13 ? null : (curMonth === 12 ? '2028-01-01' : `2027-${pad2(curMonth + 1)}-01`);
    const headerTitle = curMonth === 13 ? 'January 2028 (Carryover)' : `${mNames[curMonth - 1]} 2027`;

    calGridHtml = `
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <button ${!prevTarget ? 'disabled' : ''} onclick="selectedCalDate='${prevTarget}';renderApp()" class="px-3 py-1.5 btn-liquid-soft font-extrabold text-xs">&lt;</button>
        <div class="flex-1 text-center bg-indigo-50 text-indigo-900 font-extrabold text-xs py-2 rounded-xl">${headerTitle}</div>
        <button ${!nextTarget ? 'disabled' : ''} onclick="selectedCalDate='${nextTarget}';renderApp()" class="px-3 py-1.5 btn-liquid-soft font-extrabold text-xs">&gt;</button>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center mb-1">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="text-[10px] font-extrabold text-slate-400">${d}</div>`).join('')}
      </div>
      <div class="grid grid-cols-7 gap-1">
        ${Array(firstDow).fill('<div></div>').join('')}
        ${Array.from({ length: daysInMonth }, (_, idx) => {
          const day = idx + 1;
          const iso = `${yr}-${pad2(mo)}-${pad2(day)}`;
          const dow = new Date(Date.UTC(yr, mo - 1, day)).getUTCDay();
          const isWknd = dow === 5 || dow === 6;
          const isHol = Boolean(holMap[iso]);
          const names = getStaffOnLeaveOnDate(iso);
          const lim = getDailyLimit(iso);
          const isFull = names.length >= lim;
          return `
            <div onclick="selectedCalDate='${iso}';renderApp()"
              class="cal-tap min-h-[46px] p-1 rounded-xl border text-center ${
                isFull ? 'bg-rose-100 border-rose-300 text-rose-900' :
                isHol ? 'bg-amber-50 border-amber-300 text-amber-900' :
                isWknd ? 'bg-slate-100 border-slate-200 text-slate-500' : 'bg-white border-slate-200'
              } ${iso === selectedCalDate ? 'ring-2 ring-indigo-500' : ''}">
              <div class="text-xs font-extrabold">${day}</div>
              <div class="text-[10px] font-bold">${names.length}/${lim}</div>
            </div>`;
        }).join('')}
      </div>`;
  }

  return `
    ${modeButtons}
    ${calGridHtml}
    <div class="glass-Tint p-4 mt-3">
      <div class="font-extrabold text-sm text-indigo-950">${selectedCalDate}</div>
      ${selHol ? `<div class="text-xs font-extrabold text-amber-700 mt-0.5">Holiday: ${esc(selHol)}</div>` : ''}
      <div class="text-xs text-slate-700 mt-1">Staff on leave: <strong>${selBooked.length ? esc(selBooked.join(', ')) : 'None'}</strong></div>
      <div class="text-xs font-bold text-indigo-700 mt-0.5">Available slots: ${Math.max(0, selLimit - selBooked.length)} of ${selLimit}</div>
    </div>`;
}

// 9. CUTE MODERN GANTT CHART COMPONENT (PROPORTIONAL MONTHS + DAY COUNTS)

function renderReferenceGanttTable(isFullModal = false) {
  const flexTemplateCols = GANTT_MONTH_SEGMENTS.map(m => `${m.days}fr`).join(' ');
  const timelineMinWidth = isFullModal ? '1120px' : '1040px';

  return `
    <div class="${isFullModal ? 'p-4 sm:p-6 bg-gradient-to-br from-indigo-50/70 via-white to-pink-50/60' : 'mb-3'}">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-3 glass-card p-3">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-gradient-to-r from-indigo-500 to-pink-500"></span>
          <span class="font-extrabold text-xs sm:text-sm text-slate-800">2027 – Jan 2028 Gantt Timeline</span>
        </div>
        <div class="flex flex-wrap gap-1.5">
          <button onclick="downloadPdfExport()" class="px-3 py-1.5 btn-liquid-teal font-extrabold text-[11px]">&darr; PDF</button>
          <button onclick="downloadExcelExport()" class="px-3 py-1.5 btn-liquid-soft font-extrabold text-[11px]">&darr; Excel</button>
          ${!isFullModal ? `
            <button onclick="openFullScreenGanttModal()" class="px-3 py-1.5 btn-liquid-primary font-extrabold text-[11px]">&#x26F6; Full View</button>
          ` : `
            <button onclick="closeFullScreenGanttModal()" class="px-3.5 py-1.5 btn-liquid-danger font-extrabold text-xs">&times; Close</button>
          `}
        </div>
      </div>

      <div class="overflow-x-auto rounded-3xl border-2 border-indigo-100 shadow-lg bg-white">
        <div style="min-width:${timelineMinWidth};">
          <div class="grid grid-cols-[44px_148px_1fr] bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white font-extrabold text-xs">
            <div class="py-3 px-1 text-center border-r border-white/20">No.</div>
            <div class="py-3 px-3 text-left border-r border-white/20">Staff Member</div>
            <div class="grid text-center" style="grid-template-columns:${flexTemplateCols};">
              ${GANTT_MONTH_SEGMENTS.map(m => `<div class="py-3 border-r last:border-r-0 border-white/20 text-[10.5px] px-0.5 truncate">${m.label}</div>`).join('')}
            </div>
          </div>

          <div class="divide-y divide-indigo-50">
            ${state.staff.map((s, idx) => {
              const periods = getGanttPeriodsForStaff(s);
              return `
                <div class="grid grid-cols-[44px_148px_1fr] items-center text-xs ${idx % 2 === 0 ? 'bg-indigo-50/35' : 'bg-white'} hover:bg-pink-50/40 transition-colors">
                  <div class="py-2.5 text-center font-extrabold text-indigo-400 border-r border-indigo-50">${s.id}</div>
                  <div class="py-2.5 px-3 font-extrabold text-slate-800 border-r border-indigo-50 truncate flex items-center justify-between gap-1">
                    <span class="truncate">${esc(s.name)}</span>
                    ${s.luckyNumber ? `<span class="text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded-full font-extrabold">#${pad2(s.luckyNumber)}</span>` : ''}
                  </div>
                  <div class="relative h-8 grid" style="grid-template-columns:${flexTemplateCols};">
                    ${GANTT_MONTH_SEGMENTS.map(() => `<div class="border-r last:border-r-0 border-indigo-100/90 h-full"></div>`).join('')}
                    ${periods.map(p => {
                      const startFrac = dateToYearFraction(p.start);
                      const endFrac = dateToYearFraction(p.end) + (1 / GANTT_TOTAL_DAYS);
                      const leftPct = (startFrac * 100).toFixed(2);
                      const widthPct = Math.max(8.5, (endFrac - startFrac) * 100).toFixed(2);
                      const label = formatGanttPillLabel(p.start, p.end, p.days);
                      return `
                        <div title="${esc(s.name)}: ${label}"
                          style="left:${leftPct}%;width:${widthPct}%;"
                          class="absolute top-1 bottom-1 rounded-full px-2 flex items-center justify-center text-[9px] font-extrabold whitespace-nowrap overflow-hidden ${p.color === 'p2' ? 'gantt-pill-p2' : 'gantt-pill-p1'}">
                          ${esc(label)}
                        </div>`;
                    }).join('')}
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-2 mt-2.5 text-[11px] text-slate-500 px-1 font-semibold">
        <div class="flex items-center gap-3">
          <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full gantt-pill-p1 inline-block"></span>First Period</span>
          <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full gantt-pill-p2 inline-block"></span>Second Period</span>
        </div>
        <span>Proportional months (28/30/31d) · Swipe or tap <strong>Full View</strong></span>
      </div>
    </div>`;
}

        <div class="grid grid-cols-3 gap-2">
          <button onclick="downloadPdfExport()" class="py-2.5 btn-liquid-soft font-extrabold text-xs">&darr; PDF</button>
          <button onclick="downloadExcelExport()" class="py-2.5 btn-liquid-soft font-extrabold text-xs">&darr; Excel</button>
          <button onclick="downloadJsonBackup()" class="py-2.5 btn-liquid-soft font-extrabold text-xs">&darr; JSON</button>
        </div>
        <button onclick="toggleFinaliseCalendar()" class="w-full py-3 font-extrabold text-xs ${state.finalized ? 'btn-liquid-amber' : 'btn-liquid-primary'}">
          ${state.finalized ? 'Reopen Calendar for Edits' : 'Finalise 2027 Leave Calendar'}
        </button>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="archiveAndRestartDraw()" class="py-2.5 btn-liquid-amber font-extrabold text-xs">Archive &amp; Restart</button>
          <button onclick="resetEntireCloudState()" class="py-2.5 btn-liquid-danger font-extrabold text-xs">Reset All Data</button>
        </div>
      </div>

      ${renderReferenceGanttTable(false)}
    </div>`;
}

renderApp();
</script>
</body>
</html>
