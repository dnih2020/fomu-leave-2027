// ============================================================================
// 3. UTILITIES & DATE ENGINE
// ============================================================================
function pad2(n) { return String(n).padStart(2, '0'); }
function esc(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}
function normalizeEmail(email) {
  const clean = String(email || '').trim().toLowerCase();
  const parts = clean.split('@');
  if (parts.length !== 2) return clean;
  if (parts[1] === 'gmail.com' || parts[1] === 'googlemail.com') {
    return parts[0].split('+')[0].replace(/\./g, '') + '@gmail.com';
  }
  return clean;
}
function isManager(email) {
  return normalizeEmail(email) === normalizeEmail(MANAGER_EMAIL);
}
function parseIsoUTC(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function formatIsoUTC(dt) {
  return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`;
}
function addDays(iso, delta) {
  const dt = parseIsoUTC(iso);
  dt.setUTCDate(dt.getUTCDate() + delta);
  return formatIsoUTC(dt);
}
function eachDateInRange(startIso, endIso, callback) {
  if (!startIso || !endIso || startIso > endIso) return;
  let cur = startIso;
  while (cur <= endIso) {
    callback(cur);
    cur = addDays(cur, 1);
  }
}
function calculateWorkingDays(startIso, endIso, holidaysList) {
  if (!startIso || !endIso || startIso > endIso) {
    return { valid: false, calendarDays: 0, weekendDays: 0, weekdayHolidays: 0, workingDays: 0, dates: [] };
  }
  const holSet = new Set((holidaysList || state.holidays).map(h => h.date));
  let calendarDays = 0, weekendDays = 0, weekdayHolidays = 0;
  const dates = [];
  eachDateInRange(startIso, endIso, d => {
    dates.push(d);
    calendarDays++;
    const dow = parseIsoUTC(d).getUTCDay();
    if (dow === 5 || dow === 6) weekendDays++;
    else if (holSet.has(d)) weekdayHolidays++;
  });
  return { valid: true, calendarDays, weekendDays, weekdayHolidays, workingDays: calendarDays - weekendDays - weekdayHolidays, dates };
}
function findEndDateForWorkingDays(startIso, targetWorkingDays) {
  let cur = startIso;
  while (cur <= '2027-12-31') {
    const res = calculateWorkingDays(startIso, cur, state.holidays);
    if (res.workingDays === targetWorkingDays) return cur;
    cur = addDays(cur, 1);
  }
  return null;
}
function getDailyLimit(iso) {
  if (state.dateLimits && state.dateLimits[iso] !== undefined) return Number(state.dateLimits[iso]);
  const month = Number(iso.slice(5, 7));
  return Number(state.monthLimits[month] || 2);
}
function getStaffOnLeaveOnDate(iso, excludeStaffId = null) {
  const names = [];
  state.staff.forEach(s => {
    if (!s.confirmedAt || s.id === excludeStaffId) return;
    const inP1 = s.period1 && iso >= s.period1.start && iso <= s.period1.end;
    const inP2 = s.period2 && iso >= s.period2.start && iso <= s.period2.end;
    if (inP1 || inP2) names.push(s.name);
  });
  return names;
}
function getActiveParticipants() { return state.staff.filter(s => s.canSpin !== false); }
function getCurrentTurnMember() {
  const active = getActiveParticipants();
  if (active.length === 0 || !active.every(s => s.luckyNumber !== null)) return null;
  const sorted = active.slice().sort((a, b) => a.luckyNumber - b.luckyNumber);
  return sorted.find(s => !s.confirmedAt) || null;
}
function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function showToast(msg, type = 'info') {
  const box = document.getElementById('toastBox');
  if (!box) return;
  box.className = 'toast-msg ' + (type === 'err' ? 'bg-red-700 text-white' : type === 'warn' ? 'bg-amber-100 text-amber-900 border border-amber-300' : 'bg-[#094228] text-white');
  box.textContent = msg;
  box.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => box.classList.add('hidden'), 3400);
}

function handleSpinClick() {
  if (isSpinning) return;
  const me = getCurrentUserRecord();
  if (!me) return showToast('Staff profile not found for this email.', 'err');
  if (me.luckyNumber !== null) return showToast(`You already have number #${pad2(me.luckyNumber)}.`, 'warn');

  const active = getActiveParticipants();
  const used = new Set(active.map(s => s.luckyNumber).filter(n => n !== null));
  const pool = [];
  for (let i = 1; i <= active.length; i++) {
    if (!used.has(i)) pool.push(i);
  }
  if (pool.length === 0) return showToast('All numbers assigned.', 'err');

  isSpinning = true;
  wheelAngle += 1080 + Math.floor(Math.random() * 360);
  const wheelEl = document.getElementById('spinWheelRing');
  const hubEl = document.getElementById('spinWheelHub');
  if (wheelEl) wheelEl.style.transform = `rotate(${wheelAngle}deg)`;

  let ticks = 0;
  const rollInterval = setInterval(() => {
    ticks++;
    if (hubEl && pool.length > 0) {
      hubEl.textContent = pad2(pool[Math.floor(Math.random() * pool.length)]);
    }
    if (ticks >= 13) {
      clearInterval(rollInterval);
      runAtomicPlannerUpdate((draft) => {
        const target = draft.staff.find(s => s.id === me.id);
        const activeList = draft.staff.filter(s => s.canSpin !== false);
        const taken = new Set(activeList.map(s => s.luckyNumber).filter(n => n !== null));
        const avail = [];
        for (let i = 1; i <= activeList.length; i++) {
          if (!taken.has(i)) avail.push(i);
        }
        const chosen = avail[Math.floor(Math.random() * avail.length)];
        target.luckyNumber = chosen;
        target.spunAt = new Date().toISOString();
        draft.activity.unshift({ at: new Date().toISOString(), actor: currentUser.email, text: `${target.name} spun #${pad2(chosen)}` });
      }, 'Lucky number assigned!');
      isSpinning = false;
    }
  }, 80);
}

function ensureLeaveFormInitialized(staffId) {

function applyPeriodShortcut(periodNum, targetWorkingDays) {
  if (periodNum === 1) {
    if (!leaveForm.p1Start) leaveForm.p1Start = '2027-04-04';
    leaveForm.p1End = findEndDateForWorkingDays(leaveForm.p1Start, targetWorkingDays);
    if (targetWorkingDays === 30) {
      leaveForm.p2Enabled = false;
      leaveForm.p2Start = '';
      leaveForm.p2End = '';
    }
  } else {
    leaveForm.p2Enabled = true;
    if (!leaveForm.p2Start) leaveForm.p2Start = leaveForm.p1End ? addDays(leaveForm.p1End, 14) : '2027-09-05';
    leaveForm.p2End = findEndDateForWorkingDays(leaveForm.p2Start, targetWorkingDays);
  }
  renderApp();
}

function validateCurrentLeaveForm(staffId) {
  const c1 = calculateWorkingDays(leaveForm.p1Start, leaveForm.p1End, state.holidays);
  let c2 = { valid: true, workingDays: 0, dates: [] };
  if (leaveForm.p2Enabled && leaveForm.p2Start && leaveForm.p2End) {
    c2 = calculateWorkingDays(leaveForm.p2Start, leaveForm.p2End, state.holidays);
  }
  const totalWorking = c1.workingDays + c2.workingDays;
  let errorMsg = '';
  if (!leaveForm.p1Start || !leaveForm.p1End) errorMsg = 'Select First leave period dates.';
  else if (c1.workingDays <= 0) errorMsg = 'First period must have working days.';
  else if (leaveForm.p2Enabled && leaveForm.p2Start && leaveForm.p2End) {
    if (leaveForm.p1End >= leaveForm.p2Start) errorMsg = 'Periods cannot overlap.';
    else if (c2.workingDays <= 0) errorMsg = 'Second period must have working days.';
  }
  if (!errorMsg && totalWorking !== ENTITLEMENT_DAYS) errorMsg = `Total working days must equal 30 (currently ${totalWorking}).`;
  return { c1, c2, totalWorking, errorMsg, canConfirm: !errorMsg && totalWorking === ENTITLEMENT_DAYS };
}

async function confirmLeaveSelection() {
  const me = getCurrentUserRecord();
  const check = validateCurrentLeaveForm(me.id);
  if (!check.canConfirm) return showToast(check.errorMsg, 'err');

  await runAtomicPlannerUpdate((draft) => {
    const target = draft.staff.find(s => s.id === me.id);
    target.period1 = { start: leaveForm.p1Start, end: leaveForm.p1End };
    target.period2 = leaveForm.p2Enabled && leaveForm.p2Start ? { start: leaveForm.p2Start, end: leaveForm.p2End } : null;
    target.confirmedAt = new Date().toISOString();
    draft.activity.unshift({ at: new Date().toISOString(), actor: currentUser.email, text: `${target.name} confirmed 30 working days` });
  }, 'Leave dates confirmed successfully!');
}

  }, 'Updated spin permission');
}

async function reopenStaffSelection(staffId) {
  await runAtomicPlannerUpdate((draft) => {
    const s = draft.staff.find(x => x.id === Number(staffId));
    if (!s) return;
    s.period1 = null; s.period2 = null; s.confirmedAt = null;
  }, 'Reopened staff selection');
}

async function updateStaffEmail(staffId, newEmail) {
  const clean = String(newEmail || '').trim().toLowerCase();
  if (!clean) return;
  await runAtomicPlannerUpdate((draft) => {
    const s = draft.staff.find(x => x.id === Number(staffId));
    if (s) s.email = clean;
  }, 'Updated staff email');
}

async function autoSpinRemainingStaff() {
  await runAtomicPlannerUpdate((draft) => {
    const active = draft.staff.filter(s => s.canSpin !== false);
    const used = new Set(active.map(s => s.luckyNumber).filter(n => n !== null));
    const pool = [];
    for (let i = 1; i <= active.length; i++) {
      if (!used.has(i)) pool.push(i);
    }
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    active.forEach(s => {
      if (s.luckyNumber === null && pool.length > 0) {
        s.luckyNumber = pool.pop();
        s.spunAt = new Date().toISOString();
      }
    });
  }, 'Auto-assigned remaining spins!');
}

async function toggleFinaliseCalendar() {
  await runAtomicPlannerUpdate((draft) => {
    draft.finalized = !draft.finalized;
  }, state.finalized ? 'Calendar reopened' : 'Calendar finalised!');
}

async function archiveAndRestartDraw() {
  await runAtomicPlannerUpdate((draft) => {
    draft.archives.unshift({ archivedAt: new Date().toISOString(), staff: draft.staff });
    draft.finalized = false;
    draft.staff.forEach(s => { s.luckyNumber = null; s.period1 = null; s.period2 = null; s.confirmedAt = null; });
  }, 'Draw reset and archived!');
}

// ============================================================================
// 5. EXPORTS (PDF & EXCEL)
// ============================================================================
function dateToYearFraction(iso) {
  const dt = parseIsoUTC(iso);
  const start = Date.UTC(2027, 0, 1);
  const dayIndex = Math.max(0, Math.min(364, Math.floor((dt.getTime() - start) / 86400000)));
  return dayIndex / 365;
}

function formatGanttPillLabel(startIso, endIso) {
  if (!startIso || !endIso) return '';
  const mShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const s = parseIsoUTC(startIso);
  const e = parseIsoUTC(endIso);
  return `${s.getUTCDate()} ${mShort[s.getUTCMonth()]} – ${e.getUTCDate()} ${mShort[e.getUTCMonth()]} `;
}

function getGanttPeriodsForStaff(s) {
  const periods = [];
  if (s.confirmedAt && s.period1) {
    periods.push({ start: s.period1.start, end: s.period1.end, color: 'green' });
  }
  if (s.confirmedAt && s.period2) {
    periods.push({ start: s.period2.start, end: s.period2.end, color: 'gold' });
  }
  return periods;
}

function openFullScreenGanttModal() {
  const modal = document.getElementById('ganttFullModal');
  const body = document.getElementById('ganttFullModalContent');
  if (!modal || !body) return;
  body.innerHTML = renderReferenceGanttTable(true);
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function closeFullScreenGanttModal() {
  const modal = document.getElementById('ganttFullModal');
  if (!modal) return;
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}

function downloadPdfExport() {
  if (!window.jspdf) return showToast('PDF library loading...', 'warn');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  
  doc.setFillColor(18, 53, 91);
  doc.rect(10, 10, 277, 8, 'F');
  doc.setFontSize(12);
  doc.setTextColor(255, 255, 255);
  doc.text(`${EXPORT_TITLE} — 2027 Annual Leave Gantt`, 14, 15.3);
  doc.save(`${EXPORT_TITLE}.pdf`);
  showToast('Downloaded PDF!');
}

function downloadExcelExport() {
  if (!window.XLSX) return showToast('Excel library loading...', 'warn');
  const wb = XLSX.utils.book_new();
  const summaryRows = [['ID', 'Staff Name', 'Lucky #', 'Status']];
  state.staff.forEach(s => {
    summaryRows.push([s.id, s.name, s.luckyNumber || '', s.confirmedAt ? 'Confirmed' : 'Pending']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Staff Summary');
  XLSX.writeFile(wb, `${EXPORT_TITLE}.xlsx`);
  showToast('Downloaded Excel (.xlsx)!');
}

// ============================================================================
// 6. RENDER SYSTEM
// ============================================================================
function renderApp() {
  const frame = document.getElementById('appFrame');
  if (!frame) return;

  if (!authInitialized) {
    frame.innerHTML = `<div class="flex-1 flex items-center justify-center text-sm text-[#4b6e5e]">Loading authentication...</div>`;
    return;
  }

  if (!currentUser) {
    frame.innerHTML = renderSignInScreen();
    return;
  }

  const me = getCurrentUserRecord();
  const userIsMgr = isManager(currentUser.email);

  if (!me && !userIsMgr) {
    frame.innerHTML = `
      <div class="signin-bg flex-1 flex flex-col justify-between p-6">
        <div class="font-black text-xl text-[#0e2e20]">FOMU</div>
        <div class="bg-white rounded-3xl p-6 text-center border border-[#bce8d2]">
          <h2 class="text-lg font-bold text-red-700 mb-2">Unauthorized Account</h2>
          <p class="text-xs text-[#4b6e5e] mb-4">${esc(currentUser.email)} is not registered on the staff list.</p>
          <button onclick="handleSignOut()" class="w-full bg-[#0d5c38] text-white py-2.5 rounded-xl font-bold text-xs">Sign Out</button>
        </div>
        <div></div>
      </div>`;
    return;
  }

  const topBar = `
    <div class="px-4 py-3 bg-white border-b border-[#d1e8dc] flex items-center justify-between sticky top-0 z-20">
      <div class="font-black text-base text-[#094228]">FOMU <span class="text-xs font-normal text-[#4b6e5e]">| Leave 2027</span></div>
      <div class="flex items-center gap-2">
        ${userIsMgr ? `<button onclick="roleView=(roleView==='MANAGER'?'STAFF':'MANAGER');renderApp()" class="px-2.5 py-1 rounded-full text-xs font-bold bg-[#dff5e9] text-[#094228]">${roleView==='MANAGER'?'Staff View':'Manager'}</button>` : ''}
        <button onclick="handleSignOut()" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-[#f2fbf6] text-[#4b6e5e]">Sign Out</button>
      </div>
    </div>`;

  let body = (roleView === 'MANAGER' && userIsMgr) ? renderManagerDashboard() : renderStaffExperience(me || { name: 'Admin', luckyNumber: null, confirmedAt: null });
  frame.innerHTML = topBar + body;
}

function renderSignInScreen() {
  return `
    <div class="signin-bg flex-1 flex flex-col justify-between px-6 py-10 text-center">
      <div>
        <div class="font-black text-2xl text-[#0e2e20]">FOMU</div>
        <h1 class="text-3xl font-extrabold text-[#0e2e20] mt-12">2027 Annual Leave</h1>
      </div>
      <div class="bg-white/90 border border-[#bce8d2] rounded-3xl p-6 shadow-sm">
        <p class="text-sm text-[#4b6e5e] mb-5">Sign in securely using your registered Google account</p>
        <button onclick="handleGoogleSignIn()" class="w-full bg-[#0d5c38] hover:bg-[#094228] text-white rounded-2xl py-3.5 font-bold text-sm shadow transition flex items-center justify-center gap-2">
          Sign in with Google
        </button>
      </div>
      <div class="text-xs text-[#4b6e5e]">Noonu Atoll Hospital Department Portal</div>
    </div>`;
}

function renderStaffExperience(me) {
  const tabs = `
    <div class="px-4 pt-3 bg-white border-b border-[#d1e8dc]">
      <div class="flex items-center gap-2.5 mb-2.5">
        <div class="w-9 h-9 rounded-full bg-[#bce8d2] text-[#094228] font-bold flex items-center justify-center">${esc(me.name.charAt(0))}</div>
        <div>
          <div class="font-extrabold text-base text-[#0e2e20]">Hello, ${esc(me.name)}</div>
          <div class="text-xs text-[#4b6e5e]">${me.luckyNumber ? `Lucky Number #${pad2(me.luckyNumber)}` : 'Step 1 · Spin your number'}</div>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2 pb-2">
        <button onclick="staffTab='MY_LEAVE';renderApp()" class="py-2 rounded-xl font-bold text-xs ${staffTab==='MY_LEAVE'?'bg-[#0d5c38] text-white':'bg-[#f2fbf6] text-[#0e2e20] border'}">My leave</button>
        <button onclick="staffTab='TEAM_CAL';renderApp()" class="py-2 rounded-xl font-bold text-xs ${staffTab==='TEAM_CAL'?'bg-[#0d5c38] text-white':'bg-[#f2fbf6] text-[#0e2e20] border'}">Team calendar</button>
      </div>
    </div>`;

  if (staffTab === 'TEAM_CAL') return tabs + `<div class="p-4 flex-1">${renderTeamCalendarTab()}</div>`;
  return tabs + `<div class="p-4 flex-1">${renderMyLeaveTab(me)}</div>`;
}

function renderMyLeaveTab(me) {
  if (me.luckyNumber === null) {
    return `
      <div class="bg-[#f2fbf6] border border-[#bce8d2] rounded-2xl p-5 text-center mb-3">
        <h2 class="text-xl font-extrabold text-[#0e2e20] mb-2">Your turn to spin</h2>
        <div class="my-4 flex justify-center">
          <div class="wheel-ring" id="spinWheelRing" style="transform: rotate(${wheelAngle}deg);">
            <div class="wheel-hub" id="spinWheelHub">${rollingDisplay}</div>
          </div>
        </div>
        <button onclick="handleSpinClick()" ${isSpinning?'disabled':''} class="w-full bg-[#0d5c38] text-white font-bold py-3 rounded-xl text-sm">Spin once</button>
      </div>`;
  }

  if (me.confirmedAt && me.period1) {
    return `
      <div class="bg-[#0d5c38] text-white rounded-2xl p-4 text-center mb-3">
        <h2 class="font-extrabold text-base">Leave Confirmed ✓</h2>
        <p class="text-xs mt-1">Period 1: ${me.period1.start} to ${me.period1.end}</p>
        ${me.period2 ? `<p class="text-xs">Period 2: ${me.period2.start} to ${me.period2.end}</p>` : ''}
      </div>`;
  }

  const currentTurn = getCurrentTurnMember();
  const isMyTurn = currentTurn && currentTurn.id === me.id;

  if (!isMyTurn) {
    return `
      <div class="bg-white border rounded-2xl p-4 text-center mb-3">
        <div class="text-4xl font-black text-[#094228] mb-1">#${pad2(me.luckyNumber)}</div>
        <p class="text-xs text-[#4b6e5e]">Waiting for your turn. Currently, <strong>${currentTurn ? esc(currentTurn.name) : 'someone'}</strong> is choosing their dates.</p>
      </div>`;
  }

  ensureLeaveFormInitialized(me.id);
  const check = validateCurrentLeaveForm(me.id);

  return `
    <div class="bg-[#0d5c38] text-white rounded-xl p-3 mb-3 text-xs font-bold">It's your turn to pick your 30 working days!</div>
    <div class="bg-white border rounded-2xl p-4 mb-3">
      <h3 class="font-bold text-sm mb-2">First leave period</h3>
      <div class="grid grid-cols-2 gap-2 mb-2">
        <input type="date" value="${leaveForm.p1Start}" oninput="leaveForm.p1Start=this.value;renderApp()" />
        <input type="date" value="${leaveForm.p1End}" oninput="leaveForm.p1End=this.value;renderApp()" />
      </div>
      <button onclick="applyPeriodShortcut(1, 15)" class="text-xs text-[#0d5c38] font-bold underline">Auto-fill 15 days</button>
    </div>
    <div class="rounded-xl p-3 text-center font-bold text-xs mb-3 ${check.canConfirm?'bg-[#dff5e9] text-[#094228]':'bg-amber-100 text-amber-900'}">
      ${check.totalWorking} / 30 working days selected
    </div>
    <button onclick="confirmLeaveSelection()" ${!check.canConfirm?'disabled':''} class="w-full bg-[#0d5c38] disabled:opacity-40 text-white font-bold py-3 rounded-xl text-sm">Confirm Leave Dates</button>`;
}

function renderTeamCalendarTab() {
  return `<div class="bg-white border rounded-2xl p-4 text-center"><h3 class="font-bold text-sm">Team Calendar Overview</h3><p class="text-xs text-[#4b6e5e] mt-2">All approved department leaves for 2027.</p></div>`;
}

function renderReferenceGanttTable(isFullModal = false) {
  const mNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `
    <div class="${isFullModal ? 'p-4 sm:p-5 bg-[#eef4f9]' : 'mb-3'}">
      <div class="flex items-center justify-between gap-2 mb-3 bg-white border border-[#c5d6e8] rounded-xl p-2.5 shadow-xs">
        <span class="font-extrabold text-xs text-[#12355b]">Gantt Chart Overview</span>
        <div class="flex gap-1.5">
          <button onclick="downloadPdfExport()" class="px-2.5 py-1 rounded-lg bg-[#168a50] text-white font-bold text-[11px]">Export PDF</button>
          ${!isFullModal ? `<button onclick="openFullScreenGanttModal()" class="px-2.5 py-1 rounded-lg bg-[#12355b] text-white font-bold text-[11px]">Full View</button>` : `<button onclick="closeFullScreenGanttModal()" class="px-3 py-1 rounded-lg bg-red-700 text-white font-bold text-xs">Close</button>`}
        </div>

      <div class="overflow-x-auto rounded-xl border-2 border-[#163d66] bg-white">
        <div class="min-w-[920px]">
          <div class="grid grid-cols-[44px_156px_1fr] bg-[#12355b] text-white font-extrabold text-xs">
            <div class="py-2 px-1 text-center">No.</div>
            <div class="py-2 px-3">Staff Name</div>
            <div class="grid grid-cols-12 text-center">${mNames.map(m => `<div class="py-2">${m}</div>`).join('')}</div>
          </div>
          <div class="divide-y divide-[#c8d8e8]">
            ${state.staff.map((s, idx) => `
              <div class="grid grid-cols-[44px_156px_1fr] items-center text-xs ${idx % 2 === 0 ? 'bg-[#edf3f9]' : 'bg-white'}">

                <div class="py-2 px-3 font-bold truncate">${esc(s.name)}</div>
                <div class="relative h-7 grid grid-cols-12">
                  ${Array.from({ length: 12 }, () => `<div class="border-r border-[#c8d8e8] h-full"></div>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>`;
}

function renderManagerDashboard() {
  const activeStaff = getActiveParticipants();
  const spunCount = activeStaff.filter(s => s.luckyNumber !== null).length;
  const bookedCount = activeStaff.filter(s => s.confirmedAt).length;

  if (managerSub === 'STAFF_CONTROL') {
    return `
      <div class="p-4 flex-1">
        <button onclick="managerSub='MAIN';renderApp()" class="mb-3 px-3 py-1.5 rounded-xl border border-[#0d5c38] text-[#0d5c38] font-bold text-xs bg-white">&larr; Back</button>
        <h1 class="text-xl font-extrabold mb-3">Staff &amp; Spin Control</h1>
        <div class="space-y-2.5">
          ${state.staff.map(s => `
            <div class="bg-white border rounded-xl p-3 text-xs">
              <div class="flex justify-between items-center mb-1 font-bold">
                <span>${s.id}. ${esc(s.name)} ${s.luckyNumber ? '(#'+pad2(s.luckyNumber)+')' : ''}</span>
                <button onclick="toggleStaffSpinPermission(${s.id})" class="px-2 py-0.5 rounded font-bold ${s.canSpin!==false?'bg-emerald-100 text-emerald-900':'bg-red-100 text-red-900'}">
                  ${s.canSpin!==false?'Allowed':'Blocked'}
                </button>
              </div>
              <div class="flex gap-1 mt-1">
                <input type="email" id="mgrEmail_${s.id}" value="${esc(s.email)}" class="text-xs p-1" />
                <button onclick="updateStaffEmail(${s.id}, document.getElementById('mgrEmail_${s.id}').value)" class="px-2 bg-[#0d5c38] text-white rounded font-bold">Save</button>
              </div>
              ${s.confirmedAt ? `<button onclick="reopenStaffSelection(${s.id})" class="mt-1 text-red-700 underline font-bold">Reopen dates</button>` : ''}
            </div>
          `).join('')}
        </div>
      </div>`;
  }

  return `
    <div class="p-4 flex-1">
      <h1 class="text-2xl font-extrabold text-[#0e2e20] mb-3">Manager Dashboard</h1>
      <div class="grid grid-cols-3 gap-2 mb-3 text-center">
        <div class="bg-[#f2fbf6] border p-2.5 rounded-xl font-black text-lg">${activeStaff.length} Staff</div>
        <div class="bg-[#f2fbf6] border p-2.5 rounded-xl font-black text-lg">${spunCount} Spun</div>
        <div class="bg-[#f2fbf6] border p-2.5 rounded-xl font-black text-lg">${bookedCount} Booked</div>
      </div>
      <div class="bg-white border rounded-2xl p-4 shadow-sm space-y-2.5">
        <button onclick="autoSpinRemainingStaff()" class="w-full bg-[#1b8a5a] text-white py-2.5 rounded-xl text-xs font-bold">Auto-Spin Remaining Staff</button>
        <button onclick="managerSub='STAFF_CONTROL';renderApp()" class="w-full bg-[#dff5e9] text-[#094228] py-2.5 rounded-xl text-xs font-bold">Manage Staff List &amp; Emails</button>
        <button onclick="downloadPdfExport()" class="w-full border border-[#0d5c38] text-[#0d5c38] py-2 rounded-xl text-xs font-bold">Download PDF Report</button>
        <button onclick="downloadExcelExport()" class="w-full border border-[#0d5c38] text-[#0d5c38] py-2 rounded-xl text-xs font-bold">Download Excel (.xlsx)</button>
        <button onclick="toggleFinaliseCalendar()" class="w-full py-2.5 rounded-xl text-xs font-bold ${state.finalized?'bg-amber-100 text-amber-900':'bg-[#0d5c38] text-white'}">
          ${state.finalized ? 'Reopen Calendar' : 'Finalise Calendar'}
        </button>
        <button onclick="archiveAndRestartDraw()" class="w-full bg-red-800 text-white py-2.5 rounded-xl text-xs font-bold">Archive &amp; Restart Draw</button>
      </div>
      <div class="mt-3">${renderReferenceGanttTable(false)}</div>
    </div>`;
}

renderApp();
</script>
