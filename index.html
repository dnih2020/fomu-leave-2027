// 3. UTILITIES & MALDIVES WORKING-DAY ENGINE
// ============================================================================
function pad2(n) { return String(n).padStart(2, '0'); }
function esc(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}
function normalizeEmail(email) {
  const clean = String(email || '').trim().toLowerCase();
  const parts = clean.split('@');
  if (parts.length !== 2) return clean;
  if (parts[1] === 'gmail.com' || parts[1] === 'googlemail.com') {
    return parts[0].split('+')[0].replace(/\./g, '') + '@gmail.com';
  }
  return clean;
}
function isManager(email) {
  const norm = normalizeEmail(email);
  return MANAGER_EMAILS.some(m => normalizeEmail(m) === norm);
}
function parseIsoUTC(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function formatIsoUTC(dt) {
  return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`;
}
function addDays(iso, delta) {
  const dt = parseIsoUTC(iso);
  dt.setUTCDate(dt.getUTCDate() + delta);
  return formatIsoUTC(dt);
}
function eachDateInRange(startIso, endIso, callback) {
  if (!startIso || !endIso || startIso > endIso) return;
  let cur = startIso;
  let safety = 0;
  while (cur <= endIso && safety < 400) {
    callback(cur);
    cur = addDays(cur, 1);
    safety++;
  }
}
function calculateWorkingDays(startIso, endIso, holidaysList) {
  if (!startIso || !endIso || startIso > endIso) {
    return { valid: false, calendarDays: 0, weekendDays: 0, weekdayHolidays: 0, workingDays: 0, dates: [] };
  }
  if (!startIso.startsWith('2027-') || !endIso.startsWith('2027-')) {
    return { valid: false, calendarDays: 0, weekendDays: 0, weekdayHolidays: 0, workingDays: 0, dates: [] };
  }
  const holSet = new Set((holidaysList || state.holidays).map(h => h.date));
  let calendarDays = 0, weekendDays = 0, weekdayHolidays = 0;
  const dates = [];
  eachDateInRange(startIso, endIso, d => {
    dates.push(d);
    calendarDays++;
    const dow = parseIsoUTC(d).getUTCDay(); // 5 = Friday, 6 = Saturday
    if (dow === 5 || dow === 6) weekendDays++;
    else if (holSet.has(d)) weekdayHolidays++;
  });
  return {
    valid: true,
    calendarDays,
    weekendDays,
    weekdayHolidays,
    workingDays: calendarDays - weekendDays - weekdayHolidays,
    dates
  };
}
function findEndDateForWorkingDays(startIso, targetWorkingDays) {
  if (!startIso || !startIso.startsWith('2027-')) return null;
  let cur = startIso;
  while (cur <= '2027-12-31') {
    const res = calculateWorkingDays(startIso, cur, state.holidays);
    if (res.workingDays === targetWorkingDays) return cur;
    cur = addDays(cur, 1);
  }
  return null;
}
function getDailyLimitForState(st, iso) {
  if (st.dateLimits && st.dateLimits[iso] !== undefined) {
    return Number(st.dateLimits[iso]);
  }
  const month = Number(iso.slice(5, 7));
  return Number((st.monthLimits && st.monthLimits[month]) || 2);
}
function getDailyLimit(iso) {
  return getDailyLimitForState(state, iso);
}
function getStaffOnLeaveOnDate(iso, excludeStaffId = null, customState = null) {
  const st = customState || state;
  const names = [];
  st.staff.forEach(s => {
    if (!s.confirmedAt || s.id === excludeStaffId) return;
    const inP1 = s.period1 && iso >= s.period1.start && iso <= s.period1.end;
    const inP2 = s.period2 && iso >= s.period2.start && iso <= s.period2.end;
    if (inP1 || inP2) names.push(s.name);
  });
  return names;
}
function getActiveParticipants(customState = null) {
  const st = customState || state;
  return st.staff.filter(s => s.canSpin !== false);
}
function getCurrentTurnMember(customState = null) {
  const st = customState || state;
  const active = getActiveParticipants(st);
  if (active.length === 0 || !active.every(s => s.luckyNumber !== null)) return null;
  const sorted = active.slice().sort((a, b) => a.luckyNumber - b.luckyNumber);
  return sorted.find(s => !s.confirmedAt) || null;
}
function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function showToast(msg, type = 'info') {
  const box = document.getElementById('toastBox');
  if (!box) return;
  box.className = 'toast-msg ' + (
    type === 'err' ? 'bg-rose-600 text-white' :
    type === 'warn' ? 'bg-amber-100 text-amber-900 border border-amber-300' :
    'bg-indigo-950 text-white border border-indigo-700'
  );
  box.textContent = msg;
  box.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => box.classList.add('hidden'), 3500);
}

function handleSpinClick() {
  if (isSpinning) return;
  const me = getCurrentUserRecord();
  if (!me) return showToast('Staff profile not found for this email.', 'err');
  if (state.finalized) return showToast('Calendar is finalised and locked.', 'err');
  if (!state.drawOpen) return showToast('The lucky draw is not open yet.', 'warn');
  if (me.canSpin === false) return showToast('Your account is excluded from the spin.', 'err');
  if (me.luckyNumber !== null) return showToast(`You already spun #${pad2(me.luckyNumber)}.`, 'warn');

  const active = getActiveParticipants();
  const used = new Set(active.map(s => s.luckyNumber).filter(n => n !== null));
  const pool = [];
  for (let i = 1; i <= active.length; i++) {
    if (!used.has(i)) pool.push(i);
  }
  if (pool.length === 0) return showToast('All lucky numbers have been assigned.', 'err');

  isSpinning = true;
  wheelAngle += 1080 + Math.floor(Math.random() * 360);
  const wheelEl = document.getElementById('spinWheelRing');
  const hubEl = document.getElementById('spinWheelHub');
  if (wheelEl) wheelEl.style.transform = `rotate(${wheelAngle}deg)`;

  let ticks = 0;
  const rollInterval = setInterval(() => {
    ticks++;
    if (hubEl && pool.length > 0) {
      hubEl.textContent = pad2(pool[Math.floor(Math.random() * pool.length)]);
    }
    if (ticks >= 13) {
      clearInterval(rollInterval);
      runAtomicPlannerUpdate((draft) => {
        const target = draft.staff.find(s => s.id === me.id);
        if (!target || target.luckyNumber !== null) return;
        const activeList = draft.staff.filter(s => s.canSpin !== false);
        const taken = new Set(activeList.map(s => s.luckyNumber).filter(n => n !== null));
        const avail = [];
        for (let i = 1; i <= activeList.length; i++) {
          if (!taken.has(i)) avail.push(i);
        }
        if (avail.length === 0) throw new Error('All numbers assigned.');
        const chosen = avail[Math.floor(Math.random() * avail.length)];
        target.luckyNumber = chosen;
        target.spunAt = new Date().toISOString();
        draft.activity.unshift({
          at: new Date().toISOString(),
          actor: currentUser.email,
          text: `${target.name} spun lucky number #${pad2(chosen)}`
        });
      }, 'Lucky number assigned!');
      isSpinning = false;
    }
  }, 80);
}

function applyPeriodShortcut(periodNum, targetWorkingDays) {
  if (periodNum === 1) {
    if (!leaveForm.p1Start) leaveForm.p1Start = '2027-04-04';
    const endIso = findEndDateForWorkingDays(leaveForm.p1Start, targetWorkingDays);
    if (!endIso) return showToast(`Could not fit ${targetWorkingDays} working days before 31 Dec 2027.`, 'warn');
    leaveForm.p1End = endIso;
    if (targetWorkingDays === 30) {
      leaveForm.p2Enabled = false;
      leaveForm.p2Start = '';
      leaveForm.p2End = '';
    }
  } else {
    leaveForm.p2Enabled = true;
    if (!leaveForm.p2Start) {
      leaveForm.p2Start = leaveForm.p1End ? addDays(leaveForm.p1End, 14) : '2027-09-05';
    }
    const endIso = findEndDateForWorkingDays(leaveForm.p2Start, targetWorkingDays);
    if (!endIso) return showToast(`Could not fit ${targetWorkingDays} working days before 31 Dec 2027.`, 'warn');
    leaveForm.p2End = endIso;
  }
  renderApp();
}

function validateCurrentLeaveForm(staffId) {
  const c1 = calculateWorkingDays(leaveForm.p1Start, leaveForm.p1End, state.holidays);
  let c2 = { valid: true, calendarDays: 0, weekendDays: 0, weekdayHolidays: 0, workingDays: 0, dates: [] };
  if (leaveForm.p2Enabled && (leaveForm.p2Start || leaveForm.p2End)) {
    c2 = calculateWorkingDays(leaveForm.p2Start, leaveForm.p2End, state.holidays);
  }
  const totalWorking = (c1.valid ? c1.workingDays : 0) + (c2.valid ? c2.workingDays : 0);

  let errorMsg = '';
  if (!leaveForm.p1Start || !leaveForm.p1End) {
    errorMsg = 'Select First day and Last day for your First leave period.';
  } else if (leaveForm.p1Start > leaveForm.p1End) {
    errorMsg = 'First period start date cannot be after end date.';
  } else if (c1.workingDays <= 0) {
    errorMsg = 'First period must include at least 1 working day.';
  } else if (leaveForm.p2Enabled && (leaveForm.p2Start || leaveForm.p2End)) {
    if (!leaveForm.p2Start || !leaveForm.p2End) {
      errorMsg = 'Select both First day and Last day for your Second leave period.';
    } else if (leaveForm.p2Start > leaveForm.p2End) {
      errorMsg = 'Second period start date cannot be after end date.';
    } else if (c2.workingDays <= 0) {
      errorMsg = 'Second period must include at least 1 working day.';
    } else {
      const noOverlap = (leaveForm.p1End < leaveForm.p2Start) || (leaveForm.p2End < leaveForm.p1Start);
      if (!noOverlap) {
        errorMsg = 'First and second leave periods cannot overlap.';
      }
    }
  }

  if (!errorMsg && totalWorking !== ENTITLEMENT_DAYS) {
    errorMsg = `Total working days must equal exactly 30 (currently ${totalWorking}).`;
  }

  if (!errorMsg) {
    const allDates = [...c1.dates, ...c2.dates];
    for (const d of allDates) {
      const booked = getStaffOnLeaveOnDate(d, staffId);
      const lim = getDailyLimit(d);
      if (booked.length >= lim) {
        errorMsg = `Daily slot limit (${lim} staff) is full on ${d} (${booked.join(', ')}).`;
        break;
      }
    }
  }

  return {
    c1,
    c2,
    totalWorking,
    errorMsg,
    canConfirm: !errorMsg && totalWorking === ENTITLEMENT_DAYS
  };
}

async function confirmLeaveSelection() {
  const me = getCurrentUserRecord();
  if (!me) return;
  const check = validateCurrentLeaveForm(me.id);
  if (!check.canConfirm) return showToast(check.errorMsg || 'Please select 30 working days.', 'err');

  const p1Payload = { start: leaveForm.p1Start, end: leaveForm.p1End };
  const p2Payload = (leaveForm.p2Enabled && leaveForm.p2Start && leaveForm.p2End)
    ? { start: leaveForm.p2Start, end: leaveForm.p2End }
    : null;

  await runAtomicPlannerUpdate((draft) => {
    if (draft.finalized) throw new Error('Calendar is finalised and locked.');
    const target = draft.staff.find(s => s.id === me.id);
    if (!target) throw new Error('Staff profile not found.');

    const calc1 = calculateWorkingDays(p1Payload.start, p1Payload.end, draft.holidays);
    const calc2 = p2Payload
      ? calculateWorkingDays(p2Payload.start, p2Payload.end, draft.holidays)
      : { valid: true, workingDays: 0, dates: [] };

    const allDates = [...calc1.dates, ...calc2.dates];
    for (const d of allDates) {
      const booked = getStaffOnLeaveOnDate(d, target.id, draft);
      const lim = getDailyLimitForState(draft, d);
      if (booked.length >= lim) {
        throw new Error(`Date ${d} reached its slot limit (${lim} staff).`);
      }
    }

    target.period1 = p1Payload;
    target.period2 = p2Payload;
    target.confirmedAt = new Date().toISOString();
    target.needsHolidayReview = false;
    draft.activity.unshift({
      at: new Date().toISOString(),
      actor: currentUser.email,
      text: `${target.name} (#${pad2(target.luckyNumber)}) confirmed 30 working days`
    });
  }, `Confirmed 30 working days for ${me.name}!`);
}

async function autoSpinRemainingStaff() {
  await runAtomicPlannerUpdate((draft) => {
    const active = draft.staff.filter(s => s.canSpin !== false);
    const used = new Set(active.map(s => s.luckyNumber).filter(n => n !== null));
    const pool = [];
    for (let i = 1; i <= active.length; i++) {
      if (!used.has(i)) pool.push(i);
    }
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    active.forEach(s => {
      if (s.luckyNumber === null && pool.length > 0) {
        s.luckyNumber = pool.pop();
        s.spunAt = new Date().toISOString();
      }
    });
    draft.activity.unshift({
      at: new Date().toISOString(),
      actor: currentUser.email,
      text: 'Manager auto-assigned remaining lucky numbers'
    });
  }, 'All active staff now have lucky numbers!');
}

async function saveMonthlyLimitsFromInputs() {
  const inputs = document.querySelectorAll('.month-lim-input');
  const nextLimits = { ...state.monthLimits };
  inputs.forEach(inp => {
    nextLimits[Number(inp.dataset.month)] = Number(inp.value);
  });

  await runAtomicPlannerUpdate((draft) => {
    let conflict = null;
    eachDateInRange('2027-01-01', '2027-12-31', d => {
      if (conflict) return;
      const eff = (draft.dateLimits && draft.dateLimits[d] !== undefined)
        ? draft.dateLimits[d]
        : nextLimits[Number(d.slice(5, 7))];
      const booked = getStaffOnLeaveOnDate(d, null, draft).length;
      if (eff < booked) conflict = { d, booked, eff };
    });
    if (conflict) {
      throw new Error(`Cannot reduce limit on ${conflict.d} to ${conflict.eff} (${conflict.booked} already booked).`);
    }
    draft.monthLimits = nextLimits;
    draft.activity.unshift({
      at: new Date().toISOString(),
      actor: currentUser.email,
      text: 'Manager updated monthly slot limits'
    });
  }, 'Monthly slot limits saved!');
  managerSub = 'MAIN';
  renderApp();
}

async function saveQuickDateLimit() {
  const startEl = document.getElementById('mgrLimStart');
  const endEl = document.getElementById('mgrLimEnd');
  const valEl = document.getElementById('mgrLimVal');
  if (!startEl || !valEl) return;
  const s = startEl.value;
  const e = endEl && endEl.value ? endEl.value : s;
  const lim = Number(valEl.value);
  if (!s) return showToast('Please choose a date or start date.', 'warn');
  if (s > e) return showToast('Start date cannot be after end date.', 'err');
  if (isNaN(lim) || lim < 0) return showToast('Invalid slot limit.', 'err');

  await runAtomicPlannerUpdate((draft) => {
    let conflict = null;
    eachDateInRange(s, e, d => {
      const booked = getStaffOnLeaveOnDate(d, null, draft).length;
      if (lim < booked && !conflict) conflict = { d, booked };
    });
    if (conflict) {
      throw new Error(`Cannot set limit to ${lim} on ${conflict.d} (${conflict.booked} staff already booked).`);
    }
    draft.dateLimits = draft.dateLimits || {};
    eachDateInRange(s, e, d => {
      draft.dateLimits[d] = lim;
    });
    draft.activity.unshift({
      at: new Date().toISOString(),
      actor: currentUser.email,
      text: `Manager set daily slot limit of ${lim} for ${s} to ${e}`
    });
  }, `Saved slot limit (${lim} staff) for ${s}${e !== s ? ' to ' + e : ''}`);
}

async function removeDateLimitOverride(iso) {

    const month = Number(iso.slice(5, 7));
    const fallback = (draft.monthLimits && draft.monthLimits[month]) || 2;
    const booked = getStaffOnLeaveOnDate(iso, null, draft).length;
    if (fallback < booked) {
      throw new Error(`Cannot remove override on ${iso}: ${booked} booked exceeds monthly limit ${fallback}.`);

    if (draft.dateLimits) delete draft.dateLimits[iso];
  }, 'Removed date slot override!');

function dateToYearFraction(iso) {
  const dt = parseIsoUTC(iso);
  const start = Date.UTC(2027, 0, 1);
  const dayIndex = Math.max(0, Math.min(364, Math.floor((dt.getTime() - start) / 86400000)));
  return dayIndex / 365;
}

function formatGanttPillLabel(startIso, endIso) {
  if (!startIso || !endIso) return '';
  const mShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const s = parseIsoUTC(startIso);
  const e = parseIsoUTC(endIso);
  return `${s.getUTCDate()} ${mShort[s.getUTCMonth()]} – ${e.getUTCDate()} ${mShort[e.getUTCMonth()]}`;
}

function getGanttPeriodsForStaff(s) {
  const periods = [];
  if (s.confirmedAt && s.period1) {
    periods.push({ start: s.period1.start, end: s.period1.end, color: 'p1' });
  }
  if (s.confirmedAt && s.period2) {
    periods.push({ start: s.period2.start, end: s.period2.end, color: 'p2' });
  }
  return periods;
}

function downloadPdfExport() {
  if (!window.jspdf) return showToast('PDF library still loading, try again in a moment.', 'warn');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const statusTag = state.finalized ? 'FINAL' : 'DRAFT';

  // PAGE 1: GANTT CHART OVERVIEW
  doc.setFillColor(79, 70, 229);
  doc.roundedRect(10, 10, 277, 9, 2, 2, 'F');
  doc.setFontSize(12);
  doc.setTextColor(255, 255, 255);
  doc.text(`${EXPORT_TITLE} — 2027 Annual Leave Gantt Chart (${statusTag})`, 14, 16);

  const monthsShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthDays = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  const tableX = 10, noColW = 10, nameColW = 38, chartX = tableX + noColW + nameColW, chartW = 229, headerY = 21, headerH = 7, rowH = 8.0;

  doc.setFillColor(67, 56, 202);
  doc.rect(tableX, headerY, noColW, headerH, 'FD');
  doc.rect(tableX + noColW, headerY, nameColW, headerH, 'FD');
  doc.setFontSize(8);
  doc.setTextColor(255, 255, 255);
  doc.text('No.', tableX + noColW / 2, headerY + 4.8, { align: 'center' });
  doc.text('Staff Name', tableX + noColW + nameColW / 2, headerY + 4.8, { align: 'center' });

  let dayCursor = 0;
  monthsShort.forEach((mLabel, mIdx) => {
    const mx = chartX + (dayCursor / 365) * chartW;
    const mw = (monthDays[mIdx] / 365) * chartW;
    doc.setFillColor(67, 56, 202);
    doc.setDrawColor(129, 140, 248);
    doc.rect(mx, headerY, mw, headerH, 'FD');
    doc.text(mLabel, mx + mw / 2, headerY + 4.8, { align: 'center' });
    dayCursor += monthDays[mIdx];
  });

  state.staff.forEach((s, idx) => {
    const ry = headerY + headerH + idx * rowH;
    const isEven = idx % 2 === 0;
    doc.setDrawColor(224, 231, 255);
    doc.setFillColor(isEven ? 245 : 255, isEven ? 243 : 255, isEven ? 255 : 255);
    doc.rect(tableX, ry, noColW, rowH, 'FD');
    doc.rect(tableX + noColW, ry, nameColW, rowH, 'FD');

    let dc = 0;
    monthsShort.forEach((_, mIdx) => {
      const mx = chartX + (dc / 365) * chartW;
      const mw = (monthDays[mIdx] / 365) * chartW;
      doc.setFillColor(isEven ? 245 : 255, isEven ? 243 : 255, isEven ? 255 : 255);
      doc.rect(mx, ry, mw, rowH, 'FD');
      dc += monthDays[mIdx];
    });

    doc.setFontSize(7.8);
    doc.setTextColor(30, 27, 75);
    doc.text(String(s.id), tableX + noColW / 2, ry + 5.2, { align: 'center' });
    doc.text(s.name, tableX + noColW + 2.5, ry + 5.2);

    const periods = getGanttPeriodsForStaff(s);
    periods.forEach(p => {
      const fStart = dateToYearFraction(p.start);
      const fEnd = dateToYearFraction(p.end) + (1 / 365);
      const bx = chartX + fStart * chartW;
      const bw = Math.max(18, (fEnd - fStart) * chartW);
      if (p.color === 'p2') {
        doc.setFillColor(245, 158, 11);
      } else {
        doc.setFillColor(16, 185, 129);
      }
      doc.roundedRect(bx, ry + 1.2, bw, rowH - 2.4, 2.2, 2.2, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(6.2);
      doc.text(formatGanttPillLabel(p.start, p.end), bx + bw / 2, ry + 5.0, { align: 'center' });
    });
  });

  // PAGE 2: STAFF SUMMARY TABLE
  doc.addPage();
  doc.setTextColor(30, 27, 75);
  doc.setFontSize(14);
  doc.text(`${EXPORT_TITLE} — Staff Summary (${statusTag})`, 14, 14);
  doc.setFontSize(8.5);
  let y = 22;
  doc.text('ID | Staff Name | Lucky # | First Period | Second Period | Working Days | Status', 14, y);
  y += 6;
  state.staff.forEach(s => {
    const d1 = s.period1 ? calculateWorkingDays(s.period1.start, s.period1.end, state.holidays).workingDays : 0;
    const d2 = s.period2 ? calculateWorkingDays(s.period2.start, s.period2.end, state.holidays).workingDays : 0;
    const p1 = s.period1 ? `${s.period1.start} to ${s.period1.end} (${d1}d)` : '—';
    const p2 = s.period2 ? `${s.period2.start} to ${s.period2.end} (${d2}d)` : '—';
    const stText = s.canSpin === false ? 'Excluded' : (s.confirmedAt ? 'Confirmed' : 'Pending');
    doc.text(`${s.id}. ${s.name} | ${s.luckyNumber ? '#' + pad2(s.luckyNumber) : '—'} | ${p1} | ${p2} | ${d1 + d2}/30 | ${stText}`, 14, y);
    y += 6.2;
  });

  // PAGES 3–14: 12 MONTHLY CALENDAR GRIDS
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const holMap = {};
  state.holidays.forEach(h => { holMap[h.date] = h.name; });

  for (let m = 1; m <= 12; m++) {
    doc.addPage();
    doc.setFontSize(13);
    doc.setTextColor(30, 27, 75);
    doc.text(`${EXPORT_TITLE} — ${months[m - 1]} 2027 (${statusTag})`, 14, 13);
    const daysInMonth = new Date(Date.UTC(2027, m, 0)).getUTCDate();
    const firstDow = new Date(Date.UTC(2027, m - 1, 1)).getUTCDay();
    const cellW = 38, cellH = 28, startX = 14, startY = 21;
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach((dn, idx) => {
      doc.setFontSize(8);
      doc.text(dn, startX + idx * cellW + 2, startY - 2);
    });
    for (let d = 1; d <= daysInMonth; d++) {
      const slot = firstDow + d - 1;
      const col = slot % 7, row = Math.floor(slot / 7);
      const x = startX + col * cellW, cy = startY + row * cellH;
      const iso = `2027-${pad2(m)}-${pad2(d)}`;
      const dow = new Date(Date.UTC(2027, m - 1, d)).getUTCDay();
      if (dow === 5 || dow === 6) {
        doc.setFillColor(241, 245, 249);
        doc.rect(x, cy, cellW, cellH, 'F');
      } else if (holMap[iso]) {
        doc.setFillColor(254, 243, 199);
        doc.rect(x, cy, cellW, cellH, 'F');
      }
      doc.setDrawColor(203, 213, 225);
      doc.rect(x, cy, cellW, cellH);
      const onLeave = getStaffOnLeaveOnDate(iso);
      doc.setFontSize(7.5);
      doc.text(`${d} (${onLeave.length}/${getDailyLimit(iso)})`, x + 1.5, cy + 4);
      if (holMap[iso]) {
        doc.setFontSize(6);
        doc.text(doc.splitTextToSize(holMap[iso], cellW - 3).slice(0, 1), x + 1.5, cy + 8);
      }
      if (onLeave.length) {
        doc.setFontSize(6.5);
        doc.text(doc.splitTextToSize(onLeave.join(', '), cellW - 3).slice(0, 3), x + 1.5, cy + 12);
      }
    }
  }

  doc.save(`${EXPORT_TITLE} (${statusTag}).pdf`);
  showToast('Downloaded full 14-page PDF calendar!');
}

function downloadExcelExport() {
  if (!window.XLSX) return showToast('Excel library still loading, try again in a moment.', 'warn');
  const wb = XLSX.utils.book_new();
  const statusTag = state.finalized ? 'FINAL' : 'DRAFT';
  const summaryRows = [
    [`${EXPORT_TITLE} (${statusTag})`],
    ['ID', 'Staff Name', 'Participates', 'Lucky #', 'Period 1 Start', 'Period 1 End', 'Period 1 Working Days', 'Period 2 Start', 'Period 2 End', 'Period 2 Working Days', 'Total Working Days', 'Unallocated Days', 'Status']
  ];
  state.staff.forEach(s => {
    const d1 = s.period1 ? calculateWorkingDays(s.period1.start, s.period1.end, state.holidays).workingDays : 0;
    const d2 = s.period2 ? calculateWorkingDays(s.period2.start, s.period2.end, state.holidays).workingDays : 0;
    summaryRows.push([
      s.id, s.name, s.canSpin !== false ? 'Yes' : 'No',
      s.luckyNumber ? pad2(s.luckyNumber) : '',
      s.period1 ? s.period1.start : '', s.period1 ? s.period1.end : '', d1,
      s.period2 ? s.period2.start : '', s.period2 ? s.period2.end : '', d2,
      d1 + d2, ENTITLEMENT_DAYS - (d1 + d2),
      s.canSpin === false ? 'Excluded' : (s.confirmedAt ? 'Confirmed' : 'Pending')
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Staff Summary');

  const holMap = {};
  state.holidays.forEach(h => { holMap[h.date] = h.name; });
  const dailyRows = [['Date', 'Day', 'Holiday Name', 'Booked Count', 'Daily Slot Limit', 'Staff on Leave']];
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  eachDateInRange('2027-01-01', '2027-12-31', d => {
    const dow = dayNames[parseIsoUTC(d).getUTCDay()];
    const onLeave = getStaffOnLeaveOnDate(d);
    dailyRows.push([d, dow, holMap[d] || '', onLeave.length, getDailyLimit(d), onLeave.join(', ')]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dailyRows), '365 Day Calendar');

  XLSX.writeFile(wb, `${EXPORT_TITLE} (${statusTag}).xlsx`);
  showToast('Downloaded Excel (.xlsx) workbook!');
}

// 8. TEAM CALENDAR TAB (WEEK VIEW, MONTH VIEW & CUTE GANTT)
// ============================================================================
function renderTeamCalendarTab() {
  const holMap = {};
  state.holidays.forEach(h => { holMap[h.date] = h.name; });

  const selDt = parseIsoUTC(selectedCalDate);
  const mNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const selBooked = getStaffOnLeaveOnDate(selectedCalDate);
  const selLimit = getDailyLimit(selectedCalDate);
  const selHol = holMap[selectedCalDate] || '';

  const modeButtons = `
    <div class="flex items-center justify-between gap-2 mb-3">
      <h2 class="text-base font-extrabold text-slate-900">Team Leave Schedule</h2>
      <div class="flex gap-1.5">
        <button onclick="calViewMode='WEEK';renderApp()" class="px-2.5 py-1.5 text-[11px] font-extrabold ${calViewMode === 'WEEK' ? 'btn-liquid-primary' : 'btn-liquid-soft'}">Week</button>
        <button onclick="calViewMode='MONTH';renderApp()" class="px-2.5 py-1.5 text-[11px] font-extrabold ${calViewMode === 'MONTH' ? 'btn-liquid-primary' : 'btn-liquid-soft'}">Month</button>
        <button onclick="calViewMode='GANTT';renderApp()" class="px-2.5 py-1.5 text-[11px] font-extrabold ${calViewMode === 'GANTT' ? 'btn-liquid-primary' : 'btn-liquid-soft'}">Gantt</button>
      </div>
    </div>`;

  if (calViewMode === 'GANTT') {
    return modeButtons + renderReferenceGanttTable(false);
  }

  let calGridHtml = '';
  if (calViewMode === 'WEEK') {
    const weekStartIso = addDays(selectedCalDate, -selDt.getUTCDay());
    const weekDates = Array.from({ length: 7 }, (_, i) => addDays(weekStartIso, i));
    const dStart = parseIsoUTC(weekDates[0]);
    const dEnd = parseIsoUTC(weekDates[6]);
    const weekLabel = `${dStart.getUTCDate()} ${mNames[dStart.getUTCMonth()].slice(0, 3)} – ${dEnd.getUTCDate()} ${mNames[dEnd.getUTCMonth()].slice(0, 3)} 2027`;

    calGridHtml = `
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <button onclick="selectedCalDate=addDays(selectedCalDate,-7);renderApp()" class="px-3 py-1.5 btn-liquid-soft font-extrabold text-xs">&lt;</button>
        <div class="flex-1 text-center bg-indigo-50 text-indigo-900 font-extrabold text-xs py-2 rounded-xl">${weekLabel}</div>
        <button onclick="selectedCalDate=addDays(selectedCalDate,7);renderApp()" class="px-3 py-1.5 btn-liquid-soft font-extrabold text-xs">&gt;</button>
      </div>
      <div class="grid grid-cols-7 border border-indigo-100 rounded-2xl overflow-hidden bg-white shadow-xs">
        ${weekDates.map(iso => {
          const dt = parseIsoUTC(iso);
          const dow = dt.getUTCDay();
          const isWknd = dow === 5 || dow === 6;
          const isHol = Boolean(holMap[iso]);
          const names = getStaffOnLeaveOnDate(iso);
          const lim = getDailyLimit(iso);
          return `
            <div onclick="selectedCalDate='${iso}';renderApp()"
              class="cal-tap min-h-[108px] p-1 border-r last:border-r-0 border-slate-100 flex flex-col items-center ${isWknd ? 'bg-slate-100/70' : (isHol ? 'bg-amber-50/80' : 'bg-white')} ${iso === selectedCalDate ? 'ring-2 ring-inset ring-indigo-500' : ''}">
              <div class="text-[10px] font-extrabold text-slate-700">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dow]} ${dt.getUTCDate()}</div>
              <div class="text-[9px] font-bold text-slate-400 mb-1">${names.length}/${lim}</div>
              <div class="w-full flex flex-col gap-1">
                ${names.map(n => `<div class="bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-bold text-[9px] px-1 py-0.5 rounded-md truncate text-center shadow-2xs">${esc(n)}</div>`).join('')}
              </div>
            </div>`;
        }).join('')}
      </div>`;
  } else {
    const curMonth = selDt.getUTCMonth() + 1;
    const daysInMonth = new Date(Date.UTC(2027, curMonth, 0)).getUTCDate();
    const firstDow = new Date(Date.UTC(2027, curMonth - 1, 1)).getUTCDay();
    const prevMonth = curMonth === 1 ? 12 : curMonth - 1;
    const nextMonth = curMonth === 12 ? 1 : curMonth + 1;

    calGridHtml = `
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <button onclick="selectedCalDate='2027-${pad2(prevMonth)}-01';renderApp()" class="px-3 py-1.5 btn-liquid-soft font-extrabold text-xs">&lt;</button>
        <div class="flex-1 text-center bg-indigo-50 text-indigo-900 font-extrabold text-xs py-2 rounded-xl">${mNames[curMonth - 1]} 2027</div>
        <button onclick="selectedCalDate='2027-${pad2(nextMonth)}-01';renderApp()" class="px-3 py-1.5 btn-liquid-soft font-extrabold text-xs">&gt;</button>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center mb-1">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="text-[10px] font-extrabold text-slate-400">${d}</div>`).join('')}
      </div>
      <div class="grid grid-cols-7 gap-1">
        ${Array(firstDow).fill('<div></div>').join('')}
        ${Array.from({ length: daysInMonth }, (_, idx) => {
          const day = idx + 1;
          const iso = `2027-${pad2(curMonth)}-${pad2(day)}`;
          const dow = new Date(Date.UTC(2027, curMonth - 1, day)).getUTCDay();
          const isWknd = dow === 5 || dow === 6;
          const isHol = Boolean(holMap[iso]);
          const names = getStaffOnLeaveOnDate(iso);
          const lim = getDailyLimit(iso);
          const isFull = names.length >= lim;
          return `
            <div onclick="selectedCalDate='${iso}';renderApp()"
              class="cal-tap min-h-[46px] p-1 rounded-xl border text-center ${
                isFull ? 'bg-rose-100 border-rose-300 text-rose-900' :
                isHol ? 'bg-amber-50 border-amber-300 text-amber-900' :
                isWknd ? 'bg-slate-100 border-slate-200 text-slate-500' : 'bg-white border-slate-200'
              } ${iso === selectedCalDate ? 'ring-2 ring-indigo-500' : ''}">
              <div class="text-xs font-extrabold">${day}</div>
              <div class="text-[10px] font-bold">${names.length}/${lim}</div>
            </div>`;
        }).join('')}
      </div>`;
  }

  return `
    ${modeButtons}
    ${calGridHtml}
    <div class="glass-Tint p-4 mt-3">
      <div class="font-extrabold text-sm text-indigo-950">${selectedCalDate}</div>
      ${selHol ? `<div class="text-xs font-extrabold text-amber-700 mt-0.5">Holiday: ${esc(selHol)}</div>` : ''}
      <div class="text-xs text-slate-700 mt-1">Staff on leave: <strong>${selBooked.length ? esc(selBooked.join(', ')) : 'None'}</strong></div>
      <div class="text-xs font-bold text-indigo-700 mt-0.5">Available slots: ${Math.max(0, selLimit - selBooked.length)} of ${selLimit}</div>
    </div>`;
}

function renderReferenceGanttTable(isFullModal = false) {

      <div class="flex flex-wrap items-center justify-between gap-2 mb-3 glass-card p-3">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-gradient-to-r from-indigo-500 to-pink-500"></span>
          <span class="font-extrabold text-xs sm:text-sm text-slate-800">2027 Team Leave Gantt Timeline</span>
        </div>
        <div class="flex flex-wrap gap-1.5">
          <button onclick="downloadPdfExport()" class="px-3 py-1.5 btn-liquid-teal font-extrabold text-[11px]">&darr; PDF</button>
          <button onclick="downloadExcelExport()" class="px-3 py-1.5 btn-liquid-soft font-extrabold text-[11px]">&darr; Excel</button>
          ${!isFullModal ? `
            <button onclick="openFullScreenGanttModal()" class="px-3 py-1.5 btn-liquid-primary font-extrabold text-[11px]">&#x26F6; Full View</button>
          ` : `
            <button onclick="closeFullScreenGanttModal()" class="px-3.5 py-1.5 btn-liquid-danger font-extrabold text-xs">&times; Close</button>
          `}
        </div>
      </div>

      <div class="overflow-x-auto rounded-3xl border-2 border-indigo-100 shadow-lg bg-white">
        <div class="min-w-[920px]">
          <!-- Cute Pastel Gradient Header -->
          <div class="grid grid-cols-[44px_156px_1fr] bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white font-extrabold text-xs">
            <div class="py-3 px-1 text-center border-r border-white/20">No.</div>
            <div class="py-3 px-3 text-left border-r border-white/20">Staff Member</div>
            <div class="grid grid-cols-12 text-center">
              ${mNames.map(m => `<div class="py-3 border-r last:border-r-0 border-white/20">${m}</div>`).join('')}
            </div>
          </div>

          <!-- 21 Staff Rows -->
          <div class="divide-y divide-indigo-50">
            ${state.staff.map((s, idx) => {
              const periods = getGanttPeriodsForStaff(s);
              return `
                <div class="grid grid-cols-[44px_156px_1fr] items-center text-xs ${idx % 2 === 0 ? 'bg-indigo-50/35' : 'bg-white'} hover:bg-pink-50/40 transition-colors">
                  <div class="py-2.5 text-center font-extrabold text-indigo-400 border-r border-indigo-50">${s.id}</div>
                  <div class="py-2.5 px-3 font-extrabold text-slate-800 border-r border-indigo-50 truncate flex items-center justify-between gap-1">
                    <span class="truncate">${esc(s.name)}</span>
                    ${s.luckyNumber ? `<span class="text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded-full font-extrabold">#${pad2(s.luckyNumber)}</span>` : ''}
                  </div>
                  <div class="relative h-8 grid grid-cols-12">
                    ${Array.from({ length: 12 }, () => `<div class="border-r last:border-r-0 border-indigo-50/80 h-full"></div>`).join('')}
                    ${periods.map(p => {
                      const startFrac = dateToYearFraction(p.start);
                      const endFrac = dateToYearFraction(p.end) + (1 / 365);
                      const leftPct = (startFrac * 100).toFixed(2);
                      const widthPct = Math.max(7.2, (endFrac - startFrac) * 100).toFixed(2);
                      const label = formatGanttPillLabel(p.start, p.end);
                      return `
                        <div title="${esc(s.name)}: ${label}"
                          style="left:${leftPct}%;width:${widthPct}%;"
                          class="absolute top-1 bottom-1 rounded-full px-2 flex items-center justify-center text-[9.5px] font-extrabold whitespace-nowrap overflow-hidden ${p.color === 'p2' ? 'gantt-pill-p2' : 'gantt-pill-p1'}">
                          ${esc(label)}
                        </div>`;
                    }).join('')}
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-2 mt-2.5 text-[11px] text-slate-500 px-1 font-semibold">
        <div class="flex items-center gap-3">
          <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full gantt-pill-p1 inline-block"></span>First Leave Period</span>
          <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full gantt-pill-p2 inline-block"></span>Second Leave Period</span>
        </div>
        <span>Swipe horizontally or tap <strong>Full View</strong></span>
      </div>
    </div>`;
}

        <div class="flex items-center justify-between">
          <h2 class="font-extrabold text-sm text-slate-900">Exports &amp; Finalisation</h2>
          <span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full ${state.finalized ? 'bg-emerald-100 text-emerald-800' : 'bg-indigo-100 text-indigo-800'}">
            ${state.finalized ? 'Finalised' : 'Draft Mode'}
          </span>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="downloadPdfExport()" class="py-2.5 btn-liquid-soft font-extrabold text-xs">&darr; PDF</button>
          <button onclick="downloadExcelExport()" class="py-2.5 btn-liquid-soft font-extrabold text-xs">&darr; Excel</button>
          <button onclick="downloadJsonBackup()" class="py-2.5 btn-liquid-soft font-extrabold text-xs">&darr; JSON</button>
        </div>
        <button onclick="toggleFinaliseCalendar()" class="w-full py-3 font-extrabold text-xs ${state.finalized ? 'btn-liquid-amber' : 'btn-liquid-primary'}">
          ${state.finalized ? 'Reopen Calendar for Edits' : 'Finalise 2027 Leave Calendar'}
        </button>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="archiveAndRestartDraw()" class="py-2.5 btn-liquid-amber font-extrabold text-xs">Archive &amp; Restart</button>
          <button onclick="resetEntireCloudState()" class="py-2.5 btn-liquid-danger font-extrabold text-xs">Reset All Data</button>
        </div>
      </div>

      <!-- CUTE GANTT CHART PREVIEW -->
      ${renderReferenceGanttTable(false)}
    </div>`;
}

renderApp();
</script>
</body>
</html>
